apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

project.ext.vectoricons = [
    iconFontNames: [
        "MaterialCommunityIcons.ttf",
        "MaterialIcons.ttf",
        "Ionicons.ttf",
        "Feather.ttf",
        "FontAwesome.ttf",
        "FontAwesome5_Brands.ttf",
        "FontAwesome5_Regular.ttf",
        "FontAwesome5_Solid.ttf"
    ]
]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def nodeExecutable = System.getenv('NODE_BINARY') ?: 'C:\\Program Files\\nodejs\\node.exe'
def combisDetoxBundle = (findProperty('combis.detoxBundle') ?: 'false').toBoolean()
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def readLocalOrEnvironmentValue = { String key ->
    def value = localProperties.getProperty(key)
    if (value == null || !value.toString().trim()) {
        value = System.getenv(key)
    }

    return value?.toString()?.trim()
}

def readRuntimeBuildValue = { String key ->
    def value = System.getenv(key)
    if (value == null || !value.toString().trim()) {
        value = localProperties.getProperty(key)
    }
    if ((value == null || !value.toString().trim()) && project.ext.has('env')) {
        value = project.ext.env[key]
    }

    return value?.toString()?.trim()
}

def releaseStoreFile = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_STORE_FILE') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_STORE_FILE')
def releaseStorePassword = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_STORE_PASSWORD') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_KEY_ALIAS') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_KEY_PASSWORD') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_KEY_PASSWORD')
def hasReleaseSigningConfig = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && it.toString().trim() }

def resolveGoogleMapsApiKey = {
    def key = findProperty('GOOGLE_MAPS_API_KEY')
        ?: readRuntimeBuildValue('GOOGLE_MAPS_API_KEY')
        ?: readRuntimeBuildValue('MANECOMB_GOOGLE_MAPS_API_KEY')

    return key?.toString()?.trim() ?: 'DEV_GOOGLE_MAPS_API_KEY_NOT_SET'
}

def googleMapsApiKey = resolveGoogleMapsApiKey()
def allowCleartextTraffic = {
    def explicit = readRuntimeBuildValue('MANECOMB_ANDROID_CLEARTEXT')
    if (explicit != null && explicit.trim()) {
        return explicit.trim() == '1' || explicit.trim().equalsIgnoreCase('true')
    }

    return true
}()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file("../../index.js")
    reactNativeDir = new File([nodeExecutable, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File([nodeExecutable, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File([nodeExecutable, "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    if (combisDetoxBundle) {
        debuggableVariants = []
    }

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion = rootProject.ext.ndkVersion

    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    namespace = 'com.anonymous.combiscontrol'
    defaultConfig {
        applicationId = 'com.anonymous.combiscontrol'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        if (combisDetoxBundle) {
            missingDimensionStrategy 'detox', 'full'
        }
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: googleMapsApiKey,
            usesCleartextTraffic: allowCleartextTraffic.toString(),
        ]

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigningConfig) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            if (hasReleaseSigningConfig) {
                signingConfig = signingConfigs.release
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources = enableShrinkResources.toBoolean()
            minifyEnabled = enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs = enablePngCrunchInRelease.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def needsReleaseSigning = taskGraph.allTasks.any {
        it.path == ':app:assembleRelease' || it.path == ':app:bundleRelease'
    }

    if (needsReleaseSigning && !hasReleaseSigningConfig) {
        throw new GradleException(
            'ManeComb release signing no esta configurado. Define MANECOMB_UPLOAD_STORE_FILE, ' +
            'MANECOMB_UPLOAD_STORE_PASSWORD, MANECOMB_UPLOAD_KEY_ALIAS y MANECOMB_UPLOAD_KEY_PASSWORD ' +
            'en android/local.properties o como variables de entorno.'
        )
    }

    if (needsReleaseSigning && hasReleaseSigningConfig && !rootProject.file(releaseStoreFile).exists()) {
        throw new GradleException("No existe el keystore release: ${rootProject.file(releaseStoreFile)}")
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    if (combisDetoxBundle) {
        androidTestImplementation(project(':detox'))
        androidTestImplementation('junit:junit:4.13.2')
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// React Native new architecture regenerates codegen JNI folders during build.
// Running CMake's external native clean after those folders are already removed
// can make `gradlew clean` fail with stale autolinking paths. The app clean still
// removes Gradle outputs and `.cxx`; the next build recreates native artifacts.
tasks.configureEach { task ->
    if (task.name.startsWith("externalNativeBuildClean")) {
        task.enabled = false
    }
}

tasks.named("clean").configure {
    doFirst {
        delete file(".cxx")
    }
}
