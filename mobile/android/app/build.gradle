import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

// CI sigue compilando sin credenciales. En release real, google-services.json o las variables
// MANECOMB_FIREBASE_* inicializan Firebase antes de solicitar el token FCM.
def googleServicesConfigFile = file('google-services.json')
if (googleServicesConfigFile.exists()) {
    apply plugin: "com.google.gms.google-services"
}

project.ext.vectoricons = [
    iconFontNames: [
        "MaterialCommunityIcons.ttf",
        "MaterialIcons.ttf",
        "Ionicons.ttf",
        "Feather.ttf",
        "FontAwesome.ttf",
        "FontAwesome5_Brands.ttf",
        "FontAwesome5_Regular.ttf",
        "FontAwesome5_Solid.ttf"
    ]
]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def appMetadataFile = file("../../app.json")
if (!appMetadataFile.exists()) {
    throw new GradleException("No existe mobile/app.json; no se puede resolver la version de ManeComb.")
}

def appMetadata = new JsonSlurper().parse(appMetadataFile)
def appVersionName = appMetadata.version?.toString()?.trim()
def appVersionCodeText = appMetadata.buildNumber?.toString()?.trim()

if (!(appVersionName ==~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)) {
    throw new GradleException("mobile/app.json debe contener version SemVer valida (ejemplo: 1.1.0).")
}
if (!(appVersionCodeText ==~ /^[1-9]\d*$/)) {
    throw new GradleException("mobile/app.json debe contener buildNumber entero positivo.")
}

def appVersionCode = appVersionCodeText.toInteger()

// NODE_BINARY permite override explicito. Por defecto se resuelve desde PATH en Windows y Linux,
// evitando congelar una ruta local de Windows dentro del proyecto compartido.
def nodeExecutable = System.getenv('NODE_BINARY')
    ?: (org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'node.exe' : 'node')
def combisDetoxBundle = (findProperty('combis.detoxBundle') ?: 'false').toBoolean()
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def readLocalOrEnvironmentValue = { String key ->
    def value = localProperties.getProperty(key)
    if (value == null || !value.toString().trim()) {
        value = System.getenv(key)
    }

    return value?.toString()?.trim()
}

def readRuntimeBuildValue = { String key ->
    def value = System.getenv(key)
    if (value == null || !value.toString().trim()) {
        value = localProperties.getProperty(key)
    }
    if ((value == null || !value.toString().trim()) && project.ext.has('env')) {
        value = project.ext.env[key]
    }

    return value?.toString()?.trim()
}

def releaseStoreFile = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_STORE_FILE') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_STORE_FILE')
def releaseStorePassword = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_STORE_PASSWORD') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_KEY_ALIAS') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_KEY_PASSWORD') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_KEY_PASSWORD')
def hasReleaseSigningConfig = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && it.toString().trim() }

def resolveMapboxAccessToken = {
    def token = findProperty('MAPBOX_ACCESS_TOKEN')
        ?: readRuntimeBuildValue('MAPBOX_ACCESS_TOKEN')
        ?: readRuntimeBuildValue('MANECOMB_MAPBOX_ACCESS_TOKEN')

    return token?.toString()?.trim() ?: ''
}

def mapboxAccessToken = resolveMapboxAccessToken()
def firebaseProjectId = readRuntimeBuildValue('MANECOMB_FIREBASE_PROJECT_ID') ?: ''
def firebaseAppId = readRuntimeBuildValue('MANECOMB_FIREBASE_APP_ID') ?: ''
def firebaseApiKey = readRuntimeBuildValue('MANECOMB_FIREBASE_API_KEY') ?: ''
def firebaseSenderId = readRuntimeBuildValue('MANECOMB_FIREBASE_SENDER_ID') ?: ''
def hasManualFirebaseConfig = [
    firebaseProjectId,
    firebaseAppId,
    firebaseApiKey,
    firebaseSenderId
].every { it != null && it.toString().trim() }
def firebaseConfigured = googleServicesConfigFile.exists() || hasManualFirebaseConfig

def allowCleartextTraffic = {
    def explicit = readRuntimeBuildValue('MANECOMB_ANDROID_CLEARTEXT')
    if (explicit != null && explicit.trim()) {
        return explicit.trim() == '1' || explicit.trim().equalsIgnoreCase('true')
    }

    return true
}()

react {
    entryFile = file("../../index.js")
    reactNativeDir = new File([nodeExecutable, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File([nodeExecutable, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File([nodeExecutable, "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    if (combisDetoxBundle) {
        debuggableVariants = []
    }

    nodeExecutableAndArgs = [nodeExecutable]
    autolinkLibrariesWithApp()
}

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion = rootProject.ext.ndkVersion

    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    namespace = 'com.anonymous.combiscontrol'
    defaultConfig {
        applicationId = 'com.anonymous.combiscontrol'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        if (combisDetoxBundle) {
            missingDimensionStrategy 'detox', 'full'
        }
        manifestPlaceholders = [
            MAPBOX_ACCESS_TOKEN: mapboxAccessToken,
            usesCleartextTraffic: allowCleartextTraffic.toString(),
        ]
        resValue "string", "mapbox_access_token", mapboxAccessToken
        resValue "string", "manecomb_firebase_project_id", firebaseProjectId
        resValue "string", "manecomb_firebase_app_id", firebaseAppId
        resValue "string", "manecomb_firebase_api_key", firebaseApiKey
        resValue "string", "manecomb_firebase_sender_id", firebaseSenderId

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
        buildConfigField "boolean", "MANECOMB_FIREBASE_CONFIGURED", firebaseConfigured.toString()
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigningConfig) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            if (hasReleaseSigningConfig) {
                signingConfig = signingConfigs.release
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources = enableShrinkResources.toBoolean()
            minifyEnabled = enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs = enablePngCrunchInRelease.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def needsReleaseSigning = taskGraph.allTasks.any {
        it.path == ':app:assembleRelease' || it.path == ':app:bundleRelease'
    }

    if (needsReleaseSigning && !hasReleaseSigningConfig) {
        throw new GradleException(
            'ManeComb release signing no esta configurado. Define MANECOMB_UPLOAD_STORE_FILE, ' +
            'MANECOMB_UPLOAD_STORE_PASSWORD, MANECOMB_UPLOAD_KEY_ALIAS y MANECOMB_UPLOAD_KEY_PASSWORD ' +
            'en android/local.properties o como variables de entorno.'
        )
    }

    if (needsReleaseSigning && hasReleaseSigningConfig && !rootProject.file(releaseStoreFile).exists()) {
        throw new GradleException("No existe el keystore release: ${rootProject.file(releaseStoreFile)}")
    }

    if (needsReleaseSigning && !mapboxAccessToken.startsWith('pk.')) {
        throw new GradleException('MAPBOX_ACCESS_TOKEN publico es obligatorio para compilar Release.')
    }
}

["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    for (i in 0..<options.size()) options[i] = options[i].trim();
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Cliente Socket.IO nativo de Radio. Android no tenia ninguno: el socket
    // compartido de la app vive en JavaScript y no es alcanzable desde Kotlin.
    // Habla el mismo protocolo y los mismos contratos radio:* que el backend ya
    // expone, por lo que no introduce un segundo protocolo. org.json se excluye
    // porque la plataforma ya lo provee.
    implementation('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }

    testImplementation 'junit:junit:4.13.2'

    if (combisDetoxBundle) {
        androidTestImplementation(project(':detox'))
        androidTestImplementation('junit:junit:4.13.2')
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("externalNativeBuildClean")) {
        task.enabled = false
    }
}

tasks.named("clean").configure {
    doFirst {
        delete file(".cxx")
    }
}
