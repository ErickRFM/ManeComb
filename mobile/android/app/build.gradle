apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

project.ext.vectoricons = [
    iconFontNames: [
        "MaterialCommunityIcons.ttf",
        "MaterialIcons.ttf",
        "Ionicons.ttf",
        "Feather.ttf",
        "FontAwesome.ttf",
        "FontAwesome5_Brands.ttf",
        "FontAwesome5_Regular.ttf",
        "FontAwesome5_Solid.ttf"
    ]
]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
// NODE_BINARY sigue permitiendo un override explicito. Sin override, se resuelve desde PATH para
// que el mismo Gradle funcione en Windows local y en runners Linux; no se congela una ruta C:\\.
def nodeExecutable = System.getenv('NODE_BINARY')
    ?: (org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'node.exe' : 'node')
def combisDetoxBundle = (findProperty('combis.detoxBundle') ?: 'false').toBoolean()
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def readLocalOrEnvironmentValue = { String key ->
    def value = localProperties.getProperty(key)
    if (value == null || !value.toString().trim()) {
        value = System.getenv(key)
    }

    return value?.toString()?.trim()
}

def readRuntimeBuildValue = { String key ->
    def value = System.getenv(key)
    if (value == null || !value.toString().trim()) {
        value = localProperties.getProperty(key)
    }
    if ((value == null || !value.toString().trim()) && project.ext.has('env')) {
        value = project.ext.env[key]
    }

    return value?.toString()?.trim()
}

def releaseStoreFile = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_STORE_FILE') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_STORE_FILE')
def releaseStorePassword = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_STORE_PASSWORD') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_KEY_ALIAS') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = readLocalOrEnvironmentValue('MANECOMB_UPLOAD_KEY_PASSWORD') ?: readLocalOrEnvironmentValue('MYAPP_UPLOAD_KEY_PASSWORD')
def hasReleaseSigningConfig = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && it.toString().trim() }

def resolveMapboxAccessToken = {
    def token = findProperty('MAPBOX_ACCESS_TOKEN')
        ?: readRuntimeBuildValue('MAPBOX_ACCESS_TOKEN')
        ?: readRuntimeBuildValue('MANECOMB_MAPBOX_ACCESS_TOKEN')

    return token?.toString()?.trim() ?: ''
}

def mapboxAccessToken = resolveMapboxAccessToken()
def allowCleartextTraffic = {
    def explicit = readRuntimeBuildValue('MANECOMB_ANDROID_CLEARTEXT')
    if (explicit != null && explicit.trim()) {
        return explicit.trim() == '1' || explicit.trim().equalsIgnoreCase('true')
    }

    return true
}()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file("../../index.js")
    reactNativeDir = new File([nodeExecutable, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File([nodeExecutable, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File([nodeExecutable, "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    if (combisDetoxBundle) {
        debuggableVariants = []
    }

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    nodeExecutableAndArgs = [nodeExecutable]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'.
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'io.github.react-native-community:jsc-android-intl:2026004.+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.manecomb.app"
    defaultConfig {
        applicationId "com.manecomb.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        manifestPlaceholders = [
            MAPBOX_ACCESS_TOKEN: mapboxAccessToken,
            MANECOMB_USES_CLEARTEXT_TRAFFIC: allowCleartextTraffic.toString()
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
