name: Temporary Ventas lock repair

on:
  push:
    branches:
      - agent/ventas-product-maturity-20260815

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/ventas-product-maturity-20260815

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventas/package-lock.json

      - name: Repair lock only
        working-directory: ventas
        run: npm audit fix --package-lock-only

      - name: Verify production dependency audit
        working-directory: ventas
        run: npm audit --omit=dev --audit-level=high

      - name: Commit repaired lock
        shell: bash
        run: |
          if git diff --quiet -- ventas/package-lock.json; then
            echo "package-lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ventas/package-lock.json
          git commit -m "fix(deps): update Ventas transitive audit lock"
          git push origin HEAD:agent/ventas-product-maturity-20260815
