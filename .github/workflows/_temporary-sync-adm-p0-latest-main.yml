name: Temporary sync Admin Global P0

on:
  push:
    branches:
      - fix/adm-global-p0-security
    paths:
      - .github/workflows/_temporary-sync-adm-p0-latest-main.yml

permissions:
  contents: write

jobs:
  sync-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v5
        with:
          ref: fix/adm-global-p0-security
          fetch-depth: 0

      - name: Merge latest main and preserve both test contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "backend/package.json" ]; then
              echo "Conflictos no esperados:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --theirs backend/package.json
            node <<'NODE'
          const fs = require('fs');
          const path = 'backend/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const platformCommand = [
            'node --require ./test/setup-env.js test/platform-auth.test.js',
            'node --require ./test/setup-env.js test/platform-mfa.test.js',
            'node --require ./test/setup-env.js test/platform-api-base.test.js',
            'node --require ./test/setup-env.js test/platform-security-config.test.js'
          ].join(' && ');

          pkg.scripts['test:platform'] = platformCommand;
          if (!pkg.scripts.test.includes('npm run test:platform')) {
            pkg.scripts.test = `${pkg.scripts.test} && npm run test:platform`;
          }

          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
            git add backend/package.json
            git commit --no-edit
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-global/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix backend
          npm ci --prefix admin-global

      - name: Certify Platform security
        shell: bash
        run: npm run test:platform --prefix backend

      - name: Validate environment contract
        shell: bash
        run: node scripts/validate-environment-contract.mjs

      - name: Build Admin Global
        shell: bash
        env:
          VITE_API_URL: http://127.0.0.1:5000
        run: |
          npm run typecheck --prefix admin-global
          npm run build --prefix admin-global

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          rm .github/workflows/_temporary-sync-adm-p0-latest-main.yml
          git add -A
          git commit -m "chore(branch): sync Admin Global P0 with latest main"
          git push origin HEAD:fix/adm-global-p0-security
