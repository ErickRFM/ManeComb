name: Temporary Mobile Safe Storage Codemod

on:
  push:
    branches:
      - agent/mobile-capability-authority-20260808
    paths:
      - .github/workflows/tmp-mobile-safe-storage-codemod.yml

permissions:
  contents: write

jobs:
  patch-root-store:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/mobile-capability-authority-20260808
          fetch-depth: 0

      - name: Apply exact codemod
        run: node .github/scripts/patch-mobile-safe-web-storage.mjs

      - name: Verify patch scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "mobile/src/store/root-store.ts"
          git diff -- mobile/src/store/root-store.ts

      - name: Commit root-store patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/store/root-store.ts
          git commit -m "fix(mobile): make web session storage fail closed"
          git push origin HEAD:agent/mobile-capability-authority-20260808
