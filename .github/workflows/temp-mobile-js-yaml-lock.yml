name: Temporary scoped js-yaml lock refresh

on:
  push:
    branches:
      - fix/gps-queue-time-authority-current

permissions:
  contents: write

concurrency:
  group: temp-scoped-js-yaml-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/gps-queue-time-authority-current

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Refresh lock from scoped overrides
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const root = lock.packages?.['node_modules/js-yaml']?.version;
          const legacy = lock.packages?.['node_modules/@istanbuljs/load-nyc-config/node_modules/js-yaml']?.version;
          if (root !== '4.3.2') throw new Error(`expected root js-yaml 4.3.2, got ${root}`);
          if (legacy !== '3.15.2') throw new Error(`expected legacy js-yaml 3.15.2, got ${legacy}`);
          NODE

      - name: Commit generated lock and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package-lock.json
          git rm .github/workflows/temp-mobile-js-yaml-lock.yml
          git commit -m 'fix(deps): preserve patched js-yaml majors'
          git push origin HEAD:fix/gps-queue-time-authority-current
