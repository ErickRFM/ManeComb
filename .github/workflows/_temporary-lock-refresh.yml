name: Temporary lock refresh

on:
  push:
    branches:
      - audit/environment-integrity-20260805-v2
    paths:
      - .github/workflows/_temporary-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-locks:
    name: Refresh and commit vulnerable locks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: audit/environment-integrity-20260805-v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh Backend lock within declared ranges
        working-directory: backend
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Refresh Ventas lock within declared ranges
        working-directory: ventas
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Refresh Mobile lock within declared ranges
        working-directory: mobile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Upgrade optional Nodemailer to secure major
        working-directory: communication-service
        run: npm install --package-lock-only --ignore-scripts --save-optional nodemailer@^9.0.4

      - name: Verify runtime dependency audits
        run: |
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix ventas --omit=dev --audit-level=high
          npm audit --prefix mobile --omit=dev --audit-level=high
          npm audit --prefix communication-service --omit=dev --audit-level=high
          npm audit --prefix admin-global --omit=dev --audit-level=high

      - name: Commit exact generated manifests and locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/package.json backend/package-lock.json \
            ventas/package.json ventas/package-lock.json \
            mobile/package.json mobile/package-lock.json \
            communication-service/package.json communication-service/package-lock.json
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): refresh vulnerable production dependency locks"
          git push origin HEAD:audit/environment-integrity-20260805-v2
