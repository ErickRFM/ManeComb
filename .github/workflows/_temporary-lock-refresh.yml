name: Temporary lock refresh

on:
  push:
    branches:
      - audit/environment-integrity-20260805-v2
    paths:
      - .github/workflows/_temporary-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-locks:
    name: Refresh vulnerable locks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh Backend lock within declared ranges
        working-directory: backend
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Refresh Ventas lock within declared ranges
        working-directory: ventas
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Refresh Mobile lock within declared ranges
        working-directory: mobile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Upgrade optional Nodemailer to secure major
        working-directory: communication-service
        run: npm install --package-lock-only --ignore-scripts --save-optional nodemailer@^9.0.4

      - name: Show changed manifests
        run: git diff --stat -- backend/package.json backend/package-lock.json ventas/package.json ventas/package-lock.json mobile/package.json mobile/package-lock.json communication-service/package.json communication-service/package-lock.json

      - name: Upload reviewed lock candidates
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-refresh
          path: |
            backend/package.json
            backend/package-lock.json
            ventas/package.json
            ventas/package-lock.json
            mobile/package.json
            mobile/package-lock.json
            communication-service/package.json
            communication-service/package-lock.json
          if-no-files-found: error
          retention-days: 1
