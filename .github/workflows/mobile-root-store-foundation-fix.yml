name: Verify root-store domain delegation

on:
  push:
    branches:
      - refactor/mobile-root-store-modularization
    paths:
      - .github/workflows/mobile-root-store-foundation-fix.yml

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/mobile-root-store-modularization
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Confirm delegation contract is red before fix
        working-directory: mobile
        shell: bash
        run: |
          set +e
          npx jest src/store/root-store-foundation-wiring.test.js --runInBand
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the focused contract to fail before the fix, but it passed."
            exit 1
          fi
          echo "Focused contract is RED as expected."

      - name: Apply minimal domain delegation fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'mobile/src/store/root-store.ts';
          let source = fs.readFileSync(file, 'utf8');
          const before = `import {\n  createEmptyOperationalState,\n  createIdleMobileResources,\n  type MobileResourceDomain,\n} from './app-state-foundation';`;
          const after = `import {\n  MOBILE_RESOURCE_DOMAINS,\n  createEmptyOperationalState,\n  createIdleMobileResources,\n  type MobileResourceDomain,\n} from './app-state-foundation';`;
          if (!source.includes(before)) throw new Error('Expected app-state-foundation import was not found');
          if ((source.match(/mobileResourceDomains/g) || []).length !== 1) {
            throw new Error('Expected exactly one residual mobileResourceDomains reference');
          }
          source = source.replace(before, after);
          source = source.replace('mobileResourceDomains', 'MOBILE_RESOURCE_DOMAINS');
          if (source.includes('mobileResourceDomains')) throw new Error('Residual mobileResourceDomains reference remains');
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Verify focused contract is green
        working-directory: mobile
        run: npx jest src/store/root-store-foundation-wiring.test.js src/store/app-state-foundation.test.ts --runInBand

      - name: Verify TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/store/root-store.ts
          git commit -m "fix(mobile): complete resource domain delegation"
          git push origin HEAD:refactor/mobile-root-store-modularization
