name: Temporary PR289 security refresh

on:
  push:
    branches:
      - feat/admin-password-recovery

permissions:
  contents: write

jobs:
  refresh-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/admin-password-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Patch backend production dependencies
        working-directory: backend
        run: |
          npm install --save morgan@^1.12.0 multer@^2.3.0
          npm audit fix --package-lock-only
          npm audit --omit=dev --audit-level=high

      - name: Patch communication-service production dependencies
        working-directory: communication-service
        run: |
          npm install --save-optional nodemailer@^9.1.1
          npm audit fix --package-lock-only
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed manifests and locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json communication-service/package.json communication-service/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "fix(deps): patch PR289 production advisories"
          git push origin HEAD:feat/admin-password-recovery
