name: TEMP operational alert authority fix

on:
  push:
    branches:
      - claude/operational-alert-feedback-20260810
    paths:
      - scripts/temp-fix-operational-alert-authority.mjs
      - .github/workflows/temp-operational-alert-authority.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix mobile
      - name: Apply deterministic authority fix
        run: node scripts/temp-fix-operational-alert-authority.mjs
      - name: Backend FCM regression
        working-directory: backend
        run: node --require ./test/setup-env.js test/fcm-notifier.test.js
      - name: Mobile JS regressions
        working-directory: mobile
        run: npx jest --runInBand src/utils/operational-alert.test.ts src/store/operational-alert-wiring.test.js src/store/operational-alert-native-contract.test.js
      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Android alert policy tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --tests com.anonymous.combiscontrol.notifications.ManeCombAlertPolicyTest --no-daemon
      - name: Diff check
        run: git diff --check
      - name: Commit generated fix
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git add backend/src/services/fcm-notifier.js backend/test/fcm-notifier.test.js mobile/android/app/src/main/java/com/anonymous/combiscontrol/notifications/ManeCombAlertPolicy.kt mobile/android/app/src/main/java/com/anonymous/combiscontrol/notifications/ManeCombNotificationModule.kt mobile/android/app/src/main/java/com/anonymous/combiscontrol/notifications/ManeCombPushNotificationRenderer.kt mobile/android/app/src/test/java/com/anonymous/combiscontrol/notifications/ManeCombAlertPolicyTest.kt mobile/src/store/operational-alert-native-contract.test.js mobile/src/utils/operational-alert.ts mobile/src/utils/operational-alert.test.ts mobile/src/utils/push-notifications.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(alerts): unify foreground and push channel authority"
          git push origin HEAD:${{ github.ref_name }}
