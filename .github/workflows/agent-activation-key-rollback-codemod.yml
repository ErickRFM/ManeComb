name: Agent activation key rollback codemod

on:
  push:
    branches:
      - agent/activation-key-rollback-20260809
    paths:
      - .github/workflows/agent-activation-key-rollback-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/activation-key-rollback-20260809
          fetch-depth: 0

      - name: Apply conditional rollback edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing expected snippet: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected one occurrence but found multiple: ${label}`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          const embeddedPath = 'backend/src/data/store.js';
          let embedded = fs.readFileSync(embeddedPath, 'utf8');
          embedded = replaceOnce(
            embedded,
            `    if (filter.status && activationKey.status !== filter.status) {\n      return null;\n    }`,
            `    if (filter.status && activationKey.status !== filter.status) {\n      return null;\n    }\n\n    if (\n      Object.prototype.hasOwnProperty.call(filter, "usedByDriverId") &&\n      activationKey.usedByDriverId !== filter.usedByDriverId\n    ) {\n      return null;\n    }`,
            'embedded activation key compare-and-set filter'
          );
          fs.writeFileSync(embeddedPath, embedded);

          const mongoPath = 'backend/src/data/mongo-store.js';
          let mongo = fs.readFileSync(mongoPath, 'utf8');
          mongo = replaceOnce(
            mongo,
            `        ...(filter.companyId ? { companyId: filter.companyId } : {}),\n        ...(filter.status ? { status: filter.status } : {})`,
            `        ...(filter.companyId ? { companyId: filter.companyId } : {}),\n        ...(filter.status ? { status: filter.status } : {}),\n        ...(Object.prototype.hasOwnProperty.call(filter, "usedByDriverId")\n          ? { usedByDriverId: filter.usedByDriverId }\n          : {})`,
            'mongo activation key compare-and-set filter'
          );
          fs.writeFileSync(mongoPath, mongo);

          const servicePath = 'backend/src/services/activation-keys.js';
          let service = fs.readFileSync(servicePath, 'utf8');
          service = replaceOnce(
            service,
            `  } catch (error) {\n    // Si el registro falla despues de reclamar la unidad, se libera para no\n    // dejarla bloqueada por un conductor que nunca llego a existir.\n    if (selectedVehicle && typeof store.releaseVehicleFromDriver === "function") {\n      await store.releaseVehicleFromDriver(selectedVehicle.id, driverId).catch(() => null);\n    }\n\n    throw error;\n  }`,
            `  } catch (error) {\n    // Compensacion segura: si el fallo ocurre despues de consumir la key,\n    // restaurarla solo cuando siga ligada a ESTE intento. Ninguna compensacion\n    // debe ocultar el error original ni revertir cambios de otro proceso.\n    const compensations = [];\n\n    if (typeof store.updateActivationKey === "function") {\n      compensations.push(\n        Promise.resolve().then(() =>\n          store.updateActivationKey(\n            activationKey.id,\n            {\n              status: "available",\n              usedByDriverId: null,\n              usedByDriverState: null,\n              usedAt: null\n            },\n            {\n              companyId: context.companyId,\n              status: "used",\n              usedByDriverId: driverId\n            }\n          )\n        )\n      );\n    }\n\n    if (selectedVehicle && typeof store.releaseVehicleFromDriver === "function") {\n      compensations.push(\n        Promise.resolve().then(() => store.releaseVehicleFromDriver(selectedVehicle.id, driverId))\n      );\n    }\n\n    await Promise.allSettled(compensations);\n    throw error;\n  }`,
            'registration compensation block'
          );
          fs.writeFileSync(servicePath, service);

          const packagePath = 'backend/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const command = 'node --require ./test/setup-env.js test/activation-key-rollback.test.js';
          if (!pkg.scripts.test.includes(command)) {
            const anchor = 'node --require ./test/setup-env.js test/activation-keys.test.js';
            if (!pkg.scripts.test.includes(anchor)) throw new Error('Missing activation-keys test anchor');
            pkg.scripts.test = pkg.scripts.test.replace(anchor, `${anchor} && ${command}`);
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run activation rollback regression
        working-directory: backend
        run: node --require ./test/setup-env.js test/activation-key-rollback.test.js

      - name: Commit codemod
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/data/store.js backend/src/data/mongo-store.js backend/src/services/activation-keys.js backend/package.json
          git commit -m "fix(activation): compensate failed driver registration"
          git push origin HEAD:agent/activation-key-rollback-20260809
