name: Cleanup release integration workflows

on:
  push:
    branches:
      - release/consolidation-20260805
    paths:
      - .github/workflows/release-cleanup-integration.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidation-20260805
          fetch-depth: 0

      - name: Remove temporary release workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f \
            .github/workflows/release-consolidation-audit.yml \
            .github/workflows/release-integrate-env.yml \
            .github/workflows/release-integrate-email.yml \
            .github/workflows/release-integrate-runtime.yml \
            .github/workflows/release-integrate-motion.yml \
            .github/workflows/release-cleanup-integration.yml

          git add -A .github/workflows
          git commit -m 'chore(release): remove temporary integration workflows'
          git push origin HEAD:release/consolidation-20260805
