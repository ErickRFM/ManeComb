name: Mobile store storage RED

on:
  push:
    branches:
      - refactor/mobile-root-store-modularization
    paths:
      - .github/workflows/mobile-store-storage-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mobile-root-store-modularization
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: npm ci
      - name: Confirm focused contract fails before implementation
        working-directory: mobile
        shell: bash
        run: |
          set +e
          npx jest src/store/runtime/store-storage.test.ts --runInBand > /tmp/store-storage-red.log 2>&1
          status=$?
          set -e
          cat /tmp/store-storage-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected store-storage contract to fail before implementation."
            exit 1
          fi
          grep -q "Cannot find module './store-storage'" /tmp/store-storage-red.log || grep -q "Cannot find module" /tmp/store-storage-red.log
          echo "RED confirmed: storage runtime does not exist yet."
