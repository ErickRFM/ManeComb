name: Portal communication rebaseline

on:
  push:
    branches:
      - feat/portal-communication-20260812
    paths:
      - .github/workflows/portal-comms-rebaseline.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/portal-communication-20260812
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge current main and resolve only the known web policy overlap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge --no-ff origin/main -m "chore(comms): rebaseline on security-hardened main"; then
            echo "Main merged without conflicts"
          else
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != "ventas/public/_headers" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unresolved"
              git merge --abort || true
              exit 1
            fi
            cat > ventas/public/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            X-Permitted-Cross-Domain-Policies: none
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), browsing-topics=()
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Resource-Policy: same-site
            Origin-Agent-Cluster: ?1
            Strict-Transport-Security: max-age=63072000; includeSubDomains
            Content-Security-Policy: default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com https://*.tiles.mapbox.com; font-src 'self' data:; media-src 'self' blob: https://manecomb.onrender.com https://api.manecomb.com; connect-src 'self' https://manecomb.onrender.com wss://manecomb.onrender.com https://api.manecomb.com wss://api.manecomb.com https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://cloudflareinsights.com https://*.cloudflareinsights.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests

          /index.html
            Cache-Control: no-store, max-age=0, must-revalidate
            Pragma: no-cache

          /assets/*
            Cache-Control: public, max-age=31536000, immutable

          https://manecomb1.pages.dev/*
            X-Robots-Tag: noindex, nofollow, noarchive

          https://*.manecomb1.pages.dev/*
            X-Robots-Tag: noindex, nofollow, noarchive
          EOF
            sed -i 's/^          //' ventas/public/_headers
            git add ventas/public/_headers
            git commit --no-edit
          fi

          git push origin HEAD:feat/portal-communication-20260812
