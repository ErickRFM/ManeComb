name: RTC socket lifecycle ownership codemod

on:
  push:
    branches:
      - fix/rtc-socket-lifecycle-ownership

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message != 'rtc socket lifecycle ownership generated'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/rtc-socket-lifecycle-ownership
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply deterministic migration
        run: node scripts/apply-rtc-socket-lifecycle-ownership.js
      - name: Validate generated JavaScript
        run: |
          node --check backend/src/modules/rtc/live-authority.js
          node --check backend/src/services/rtc-call-service.js
          node --check backend/src/sockets/index.js
          node --check backend/test/helpers/fake-redis.js
          node --check backend/test/rtc-call-reconnect-lifecycle.test.js
          node --check backend/test/rtc-distributed-authority.test.js
          node --check backend/test/rtc-call-signaling.test.js
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run focused RTC regressions
        working-directory: backend
        run: |
          node --require ./test/setup-env.js test/rtc-call-signaling.test.js
          node --require ./test/setup-env.js test/rtc-call-reconnect-lifecycle.test.js
          node --require ./test/setup-env.js test/rtc-distributed-authority.test.js
      - name: Commit generated migration
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git add backend/src/modules/rtc/live-authority.js backend/src/services/rtc-call-service.js backend/src/sockets/index.js backend/test/helpers/fake-redis.js backend/test/rtc-call-reconnect-lifecycle.test.js backend/test/rtc-distributed-authority.test.js backend/test/rtc-call-signaling.test.js
          git commit -m "rtc socket lifecycle ownership generated"
          git push origin HEAD:fix/rtc-socket-lifecycle-ownership
