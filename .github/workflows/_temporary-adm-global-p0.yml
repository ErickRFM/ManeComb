name: Temporary Admin Global P0

on:
  push:
    branches:
      - fix/adm-global-p0-security
    paths:
      - .github/workflows/_temporary-adm-global-p0.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v5
        with:
          ref: fix/adm-global-p0-security
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Apply fail-closed security patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              write(path, content.replace(old, new, 1))

          auth_service = "backend/src/modules/platform/platform-auth-service.js"
          replace_once(
              auth_service,
              '''  await getStore(req).updatePlatformUser(user._id, {
            lastLoginAt: new Date(),
            failedLoginAttempts: 0,
            lockedUntil: null
          });

          const { refreshToken, session } = await createPlatformSession(user._id, req);

          const mfaRequired = isMfaRequired(user.role) && isMfaOperational();

          if (mfaRequired) {''',
              '''  const mfaRequired = isMfaRequired(user.role);
          if (mfaRequired && !isMfaOperational()) {
            await recordPlatformAction(req, {
              action: "platform.auth.unavailable",
              actorId: user._id,
              platformRole: user.role,
              severity: "error",
              metadata: { result: "denied", reasonCode: "mfa_not_operational" }
            });
            return { error: "Autenticación de plataforma no disponible", status: 503 };
          }

          await getStore(req).updatePlatformUser(user._id, {
            lastLoginAt: new Date(),
            failedLoginAttempts: 0,
            lockedUntil: null
          });

          const { refreshToken, session } = await createPlatformSession(user._id, req);

          if (mfaRequired) {'''
          )
          replace_once(
              auth_service,
              '''async function refresh(refreshTokenValue, req) {
          if (!isPlatformSecretValid()) {
            return { error: "Autenticación de plataforma no disponible", status: 503 };
          }
          try {''',
              '''async function refresh(refreshTokenValue, req) {
          if (!isPlatformSecretValid()) {
            return { error: "Autenticación de plataforma no disponible", status: 503 };
          }
          // Todos los roles Platform soportados requieren MFA. Se valida antes de
          // rotar el refresh token para no invalidar una sesión durante una falla de configuración.
          if (!isMfaOperational()) {
            return { error: "Autenticación de plataforma no disponible", status: 503 };
          }
          try {'''
          )
          replace_once(
              auth_service,
              '    const mfaRequired = isMfaRequired(user.role) && isMfaOperational();',
              '    const mfaRequired = isMfaRequired(user.role);'
          )

          middleware = "backend/src/middlewares/platform-auth.js"
          replace_once(
              middleware,
              '''    const { isMfaRequired, isMfaOperational } = require("../modules/platform/platform-mfa-service");
          if (isMfaRequired(user.role) && isMfaOperational() && !session.mfaVerified) {
            return res.status(403).json({ ok: false, message: "MFA requerido para acceder" });
          }''',
              '''    const { isMfaRequired, isMfaOperational } = require("../modules/platform/platform-mfa-service");
          const mfaRequired = isMfaRequired(user.role);
          if (mfaRequired && !isMfaOperational()) {
            return res.status(503).json({ ok: false, message: "Autenticación de plataforma no disponible" });
          }
          if (mfaRequired && !session.mfaVerified) {
            return res.status(403).json({ ok: false, message: "MFA requerido para acceder" });
          }'''
          )
          replace_once(
              middleware,
              '''async function requireMfa(req, res, next) {
          const session = req.platformSession;''',
              '''async function requireMfa(req, res, next) {
          const { isMfaOperational } = require("../modules/platform/platform-mfa-service");
          if (!isMfaOperational()) {
            return res.status(503).json({ ok: false, message: "Autenticación de plataforma no disponible" });
          }

          const session = req.platformSession;'''
          )

          env_path = "backend/src/config/env.js"
          replace_once(
              env_path,
              '''const DEFAULT_CLIENT_ORIGINS = [
          "https://manecomb1.pages.dev",
          "https://*.manecomb1.pages.dev",
          "http://localhost:5173",
          "http://127.0.0.1:5173"
          ];''',
              '''const DEFAULT_CLIENT_ORIGINS = [
          "https://manecomb1.pages.dev",
          "https://*.manecomb1.pages.dev",
          "https://admin.manecomb.com",
          "http://localhost:5173",
          "http://127.0.0.1:5173",
          "http://localhost:5174",
          "http://127.0.0.1:5174"
          ];'''
          )

          replace_once(
              "backend/.env.example",
              '''# Admin Global / Platform — secretos distintos a JWT_SECRET
          PLATFORM_JWT_SECRET=
          PLATFORM_ACCESS_TOKEN_TTL=15m
          PLATFORM_REFRESH_TOKEN_TTL_DAYS=30
          # Base64 de 32 bytes para AES-256-GCM.
          PLATFORM_MFA_ENCRYPTION_KEY=
          PLATFORM_MFA_CHALLENGE_TTL=5m''',
              '''# Admin Global / Platform — secretos distintos a JWT_SECRET
          # En runtime productivo, si se configura cualquiera de los dos secretos,
          # ambos deben ser válidos o el backend abortará antes de escuchar tráfico.
          PLATFORM_JWT_SECRET=
          PLATFORM_ACCESS_TOKEN_TTL=15m
          PLATFORM_REFRESH_TOKEN_TTL_DAYS=30
          # Base64 canónico de exactamente 32 bytes para AES-256-GCM.
          PLATFORM_MFA_ENCRYPTION_KEY=
          PLATFORM_MFA_CHALLENGE_TTL=5m'''
          )
          replace_once(
              "backend/.env.example",
              'CLIENT_ORIGIN=http://localhost:5173,http://127.0.0.1:5173,https://manecomb.com,https://www.manecomb.com,https://manecomb1.pages.dev,https://*.manecomb1.pages.dev',
              'CLIENT_ORIGIN=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://manecomb.com,https://www.manecomb.com,https://admin.manecomb.com,https://manecomb1.pages.dev,https://*.manecomb1.pages.dev'
          )

          write("backend/src/config/platform-security.js", '''const {
            IS_PRODUCTION_RUNTIME,
            PLATFORM_JWT_SECRET,
            PLATFORM_MFA_ENCRYPTION_KEY
          } = require("./env");

          class PlatformSecurityConfigurationError extends Error {
            constructor(message) {
              super(message);
              this.name = "PlatformSecurityConfigurationError";
              this.code = "PLATFORM_SECURITY_CONFIGURATION_INVALID";
              this.statusCode = 503;
            }
          }

          function isValidPlatformJwtSecret(value = PLATFORM_JWT_SECRET) {
            return String(value || "").trim().length >= 32;
          }

          function isValidPlatformMfaEncryptionKey(value = PLATFORM_MFA_ENCRYPTION_KEY) {
            const normalized = String(value || "").trim();
            if (!normalized || normalized.length % 4 !== 0) return false;
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(normalized)) return false;

            try {
              const decoded = Buffer.from(normalized, "base64");
              return decoded.length === 32 && decoded.toString("base64") === normalized;
            } catch {
              return false;
            }
          }

          function getPlatformSecurityStatus(overrides = {}) {
            const jwtSecret = Object.prototype.hasOwnProperty.call(overrides, "jwtSecret")
              ? overrides.jwtSecret
              : PLATFORM_JWT_SECRET;
            const mfaEncryptionKey = Object.prototype.hasOwnProperty.call(overrides, "mfaEncryptionKey")
              ? overrides.mfaEncryptionKey
              : PLATFORM_MFA_ENCRYPTION_KEY;
            const jwtConfigured = Boolean(String(jwtSecret || "").trim());
            const mfaConfigured = Boolean(String(mfaEncryptionKey || "").trim());
            const jwtReady = isValidPlatformJwtSecret(jwtSecret);
            const mfaReady = isValidPlatformMfaEncryptionKey(mfaEncryptionKey);

            return {
              configured: jwtConfigured || mfaConfigured,
              jwtConfigured,
              mfaConfigured,
              jwtReady,
              mfaReady,
              ready: jwtReady && mfaReady
            };
          }

          function assertPlatformSecurityConfiguration(options = {}) {
            const production = Object.prototype.hasOwnProperty.call(options, "production")
              ? Boolean(options.production)
              : IS_PRODUCTION_RUNTIME;
            const status = getPlatformSecurityStatus(options);

            if (production && status.configured && !status.ready) {
              throw new PlatformSecurityConfigurationError(
                "La configuración de Admin Global está incompleta: PLATFORM_JWT_SECRET y PLATFORM_MFA_ENCRYPTION_KEY deben ser válidos."
              );
            }

            return status;
          }

          module.exports = {
            PlatformSecurityConfigurationError,
            isValidPlatformJwtSecret,
            isValidPlatformMfaEncryptionKey,
            getPlatformSecurityStatus,
            assertPlatformSecurityConfiguration
          };
          ''')

          server = "backend/src/server.js"
          replace_once(
              server,
              '''} = require("./config/env");
          const { createEmbeddedStore, createMongoStore } = require("./data/store");''',
              '''} = require("./config/env");
          const { assertPlatformSecurityConfiguration } = require("./config/platform-security");
          const { createEmbeddedStore, createMongoStore } = require("./data/store");'''
          )
          replace_once(
              server,
              '''async function startServer() {
          await connectDB();''',
              '''async function startServer() {
          const platformSecurity = assertPlatformSecurityConfiguration();
          logger.info({
            action: "PlatformSecurityConfiguration",
            metadata: platformSecurity,
            module: "Platform",
            status: platformSecurity.ready ? "ready" : platformSecurity.configured ? "degraded" : "disabled"
          });

          await connectDB();'''
          )

          package_path = Path("backend/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          platform_command = " && ".join([
              "node --require ./test/setup-env.js test/platform-auth.test.js",
              "node --require ./test/setup-env.js test/platform-mfa.test.js",
              "node --require ./test/setup-env.js test/platform-api-base.test.js",
              "node --require ./test/setup-env.js test/platform-security-config.test.js"
          ])
