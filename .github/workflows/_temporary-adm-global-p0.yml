name: Temporary Admin Global P0

on:
  push:
    branches:
      - fix/adm-global-p0-security
    paths:
      - .github/workflows/_temporary-adm-global-p0.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v5
        with:
          ref: fix/adm-global-p0-security
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Apply fail-closed security patch
        shell: bash
        run: |
          cat > /tmp/apply-adm-p0.py <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))

          def sub_once(path, pattern, replacement):
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:100]!r}")
              write(path, updated)

          auth_service = "backend/src/modules/platform/platform-auth-service.js"
          sub_once(
              auth_service,
              r"  await getStore\(req\)\.updatePlatformUser\(user\._id, \{\n    lastLoginAt: new Date\(\),\n    failedLoginAttempts: 0,\n    lockedUntil: null\n  \}\);\n\n  const \{ refreshToken, session \} = await createPlatformSession\(user\._id, req\);\n\n  const mfaRequired = isMfaRequired\(user\.role\) && isMfaOperational\(\);\n\n  if \(mfaRequired\) \{",
              "\n".join([
                  "  const mfaRequired = isMfaRequired(user.role);",
                  "  if (mfaRequired && !isMfaOperational()) {",
                  "    await recordPlatformAction(req, {",
                  "      action: \"platform.auth.unavailable\",",
                  "      actorId: user._id,",
                  "      platformRole: user.role,",
                  "      severity: \"error\",",
                  "      metadata: { result: \"denied\", reasonCode: \"mfa_not_operational\" }",
                  "    });",
                  "    return { error: \"Autenticación de plataforma no disponible\", status: 503 };",
                  "  }",
                  "",
                  "  await getStore(req).updatePlatformUser(user._id, {",
                  "    lastLoginAt: new Date(),",
                  "    failedLoginAttempts: 0,",
                  "    lockedUntil: null",
                  "  });",
                  "",
                  "  const { refreshToken, session } = await createPlatformSession(user._id, req);",
                  "",
                  "  if (mfaRequired) {"
              ])
          )
          replace_once(
              auth_service,
              "async function refresh(refreshTokenValue, req) {\n  if (!isPlatformSecretValid()) {\n    return { error: \"Autenticación de plataforma no disponible\", status: 503 };\n  }\n  try {",
              "async function refresh(refreshTokenValue, req) {\n  if (!isPlatformSecretValid()) {\n    return { error: \"Autenticación de plataforma no disponible\", status: 503 };\n  }\n  // Se valida antes de rotar el refresh token para conservar la sesión durante\n  // una falla de configuración y negar el acceso de forma cerrada.\n  if (!isMfaOperational()) {\n    return { error: \"Autenticación de plataforma no disponible\", status: 503 };\n  }\n  try {"
          )
          replace_once(
              auth_service,
              "    const mfaRequired = isMfaRequired(user.role) && isMfaOperational();",
              "    const mfaRequired = isMfaRequired(user.role);"
          )

          middleware = "backend/src/middlewares/platform-auth.js"
          replace_once(
              middleware,
              "    const { isMfaRequired, isMfaOperational } = require(\"../modules/platform/platform-mfa-service\");\n    if (isMfaRequired(user.role) && isMfaOperational() && !session.mfaVerified) {\n      return res.status(403).json({ ok: false, message: \"MFA requerido para acceder\" });\n    }",
              "    const { isMfaRequired, isMfaOperational } = require(\"../modules/platform/platform-mfa-service\");\n    const mfaRequired = isMfaRequired(user.role);\n    if (mfaRequired && !isMfaOperational()) {\n      return res.status(503).json({ ok: false, message: \"Autenticación de plataforma no disponible\" });\n    }\n    if (mfaRequired && !session.mfaVerified) {\n      return res.status(403).json({ ok: false, message: \"MFA requerido para acceder\" });\n    }"
          )
          replace_once(
              middleware,
              "async function requireMfa(req, res, next) {\n  const session = req.platformSession;",
              "async function requireMfa(req, res, next) {\n  const { isMfaOperational } = require(\"../modules/platform/platform-mfa-service\");\n  if (!isMfaOperational()) {\n    return res.status(503).json({ ok: false, message: \"Autenticación de plataforma no disponible\" });\n  }\n\n  const session = req.platformSession;"
          )

          env_path = "backend/src/config/env.js"
          replace_once(
              env_path,
              "const DEFAULT_CLIENT_ORIGINS = [\n  \"https://manecomb1.pages.dev\",\n  \"https://*.manecomb1.pages.dev\",\n  \"http://localhost:5173\",\n  \"http://127.0.0.1:5173\"\n];",
              "const DEFAULT_CLIENT_ORIGINS = [\n  \"https://manecomb1.pages.dev\",\n  \"https://*.manecomb1.pages.dev\",\n  \"https://admin.manecomb.com\",\n  \"http://localhost:5173\",\n  \"http://127.0.0.1:5173\",\n  \"http://localhost:5174\",\n  \"http://127.0.0.1:5174\"\n];"
          )

          env_example = "backend/.env.example"
          replace_once(
              env_example,
              "# Admin Global / Platform — secretos distintos a JWT_SECRET\nPLATFORM_JWT_SECRET=\nPLATFORM_ACCESS_TOKEN_TTL=15m\nPLATFORM_REFRESH_TOKEN_TTL_DAYS=30\n# Base64 de 32 bytes para AES-256-GCM.\nPLATFORM_MFA_ENCRYPTION_KEY=\nPLATFORM_MFA_CHALLENGE_TTL=5m",
              "# Admin Global / Platform — secretos distintos a JWT_SECRET\n# En runtime productivo, si se configura cualquiera de los dos secretos,\n# ambos deben ser válidos o el backend abortará antes de escuchar tráfico.\nPLATFORM_JWT_SECRET=\nPLATFORM_ACCESS_TOKEN_TTL=15m\nPLATFORM_REFRESH_TOKEN_TTL_DAYS=30\n# Base64 canónico de exactamente 32 bytes para AES-256-GCM.\nPLATFORM_MFA_ENCRYPTION_KEY=\nPLATFORM_MFA_CHALLENGE_TTL=5m"
          )
          replace_once(
              env_example,
              "CLIENT_ORIGIN=http://localhost:5173,http://127.0.0.1:5173,https://manecomb.com,https://www.manecomb.com,https://manecomb1.pages.dev,https://*.manecomb1.pages.dev",
              "CLIENT_ORIGIN=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://manecomb.com,https://www.manecomb.com,https://admin.manecomb.com,https://manecomb1.pages.dev,https://*.manecomb1.pages.dev"
          )

          write("backend/src/config/platform-security.js", "\n".join([
              "const {",
              "  IS_PRODUCTION_RUNTIME,",
              "  PLATFORM_JWT_SECRET,",
              "  PLATFORM_MFA_ENCRYPTION_KEY",
              "} = require(\"./env\");",
              "",
              "class PlatformSecurityConfigurationError extends Error {",
              "  constructor(message) {",
              "    super(message);",
              "    this.name = \"PlatformSecurityConfigurationError\";",
              "    this.code = \"PLATFORM_SECURITY_CONFIGURATION_INVALID\";",
              "    this.statusCode = 503;",
              "  }",
              "}",
              "",
              "function isValidPlatformJwtSecret(value = PLATFORM_JWT_SECRET) {",
              "  return String(value || \"\").trim().length >= 32;",
              "}",
              "",
              "function isValidPlatformMfaEncryptionKey(value = PLATFORM_MFA_ENCRYPTION_KEY) {",
              "  const normalized = String(value || \"\").trim();",
              "  if (!normalized || normalized.length % 4 !== 0) return false;",
              "  if (!/^[A-Za-z0-9+/]+={0,2}$/.test(normalized)) return false;",
              "  try {",
              "    const decoded = Buffer.from(normalized, \"base64\");",
              "    return decoded.length === 32 && decoded.toString(\"base64\") === normalized;",
              "  } catch {",
              "    return false;",
              "  }",
              "}",
              "",
              "function getPlatformSecurityStatus(overrides = {}) {",
              "  const jwtSecret = Object.prototype.hasOwnProperty.call(overrides, \"jwtSecret\")",
              "    ? overrides.jwtSecret",
              "    : PLATFORM_JWT_SECRET;",
              "  const mfaEncryptionKey = Object.prototype.hasOwnProperty.call(overrides, \"mfaEncryptionKey\")",
              "    ? overrides.mfaEncryptionKey",
              "    : PLATFORM_MFA_ENCRYPTION_KEY;",
              "  const jwtConfigured = Boolean(String(jwtSecret || \"\").trim());",
              "  const mfaConfigured = Boolean(String(mfaEncryptionKey || \"\").trim());",
              "  const jwtReady = isValidPlatformJwtSecret(jwtSecret);",
              "  const mfaReady = isValidPlatformMfaEncryptionKey(mfaEncryptionKey);",
              "  return {",
              "    configured: jwtConfigured || mfaConfigured,",
              "    jwtConfigured,",
              "    mfaConfigured,",
              "    jwtReady,",
              "    mfaReady,",
              "    ready: jwtReady && mfaReady",
              "  };",
              "}",
              "",
              "function assertPlatformSecurityConfiguration(options = {}) {",
              "  const production = Object.prototype.hasOwnProperty.call(options, \"production\")",
              "    ? Boolean(options.production)",
              "    : IS_PRODUCTION_RUNTIME;",
              "  const status = getPlatformSecurityStatus(options);",
              "  if (production && status.configured && !status.ready) {",
              "    throw new PlatformSecurityConfigurationError(",
              "      \"La configuración de Admin Global está incompleta: PLATFORM_JWT_SECRET y PLATFORM_MFA_ENCRYPTION_KEY deben ser válidos.\"",
              "    );",
              "  }",
              "  return status;",
              "}",
              "",
              "module.exports = {",
              "  PlatformSecurityConfigurationError,",
              "  isValidPlatformJwtSecret,",
              "  isValidPlatformMfaEncryptionKey,",
              "  getPlatformSecurityStatus,",
              "  assertPlatformSecurityConfiguration",
              "};",
              ""
          ]))

          server = "backend/src/server.js"
          replace_once(
              server,
              "} = require(\"./config/env\");\nconst { createEmbeddedStore, createMongoStore } = require(\"./data/store\");",
              "} = require(\"./config/env\");\nconst { assertPlatformSecurityConfiguration } = require(\"./config/platform-security\");\nconst { createEmbeddedStore, createMongoStore } = require(\"./data/store\");"
          )
          replace_once(
              server,
              "async function startServer() {\n  await connectDB();",
              "async function startServer() {\n  const platformSecurity = assertPlatformSecurityConfiguration();\n  logger.info({\n    action: \"PlatformSecurityConfiguration\",\n    metadata: platformSecurity,\n    module: \"Platform\",\n    status: platformSecurity.ready ? \"ready\" : platformSecurity.configured ? \"degraded\" : \"disabled\"\n  });\n\n  await connectDB();"
          )

          package_path = Path("backend/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          platform_tests = [
              "node --require ./test/setup-env.js test/platform-auth.test.js",
              "node --require ./test/setup-env.js test/platform-mfa.test.js",
              "node --require ./test/setup-env.js test/platform-api-base.test.js",
              "node --require ./test/setup-env.js test/platform-security-config.test.js"
          ]
          package["scripts"]["test:platform"] = " && ".join(platform_tests)
          if "npm run test:platform" not in package["scripts"]["test"]:
              package["scripts"]["test"] += " && npm run test:platform"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          platform_auth_test = "backend/test/platform-auth.test.js"
          replace_once(
              platform_auth_test,
              "process.env.MONGODB_URI = \"\";",
              "process.env.MONGODB_URI = \"\";\nprocess.env.PLATFORM_MFA_ENCRYPTION_KEY = \"MinzFLmGlxqwGor12GdyXqZYsRea/r+QAWuVhEvPMRg=\";"
          )
          replace_once(
              platform_auth_test,
              "const jwt = require(\"jsonwebtoken\");",
              "const jwt = require(\"jsonwebtoken\");\nconst { encrypt, decrypt } = require(\"../src/utils/platform-mfa-crypto\");\nconst { generateBase32Secret, generateTOTP, TOTP_PERIOD } = require(\"../src/utils/platform-totp\");\nconst { mfaVerify } = require(\"../src/modules/platform/platform-mfa-service\");"
          )
          replace_once(
              platform_auth_test,
              "    platformAuth: overrides?.platformAuth || null\n  };",
              "    platformAuth: overrides?.platformAuth || null,\n    body: overrides?.body || {}\n  };"
          )
          replace_once(
              platform_auth_test,
              "  req = mockReq();\n\n  // 1",
              "\n".join([
                  "  req = mockReq();",
                  "",
                  "  function enableMfa(email) {",
                  "    const user = store.getPlatformUserByEmail(email);",
                  "    const secret = generateBase32Secret();",
                  "    store.updatePlatformUser(user.id || user._id, {",
                  "      mfaEnabled: true,",
                  "      mfaEnrollmentRequired: false,",
                  "      mfaSecretEncrypted: encrypt(secret),",
                  "      mfaBackupCodes: []",
                  "    });",
                  "  }",
                  "",
                  "  enableMfa(\"auth-test@manecomb.com\");",
                  "  enableMfa(\"owner@manecomb.com\");",
                  "",
                  "  async function loginWithMfa(email, password) {",
                  "    const { login } = require(\"../src/modules/platform/platform-auth-service\");",
                  "    const initial = await login(email, password, req);",
                  "    if (initial.error) return initial;",
                  "    assert.ok(initial.mfaRequired);",
                  "    assert.ok(initial.challengeToken);",
                  "    assert.ok(!initial.token);",
                  "    const user = store.getPlatformUserByEmail(String(email).trim().toLowerCase());",
                  "    const secret = decrypt(user.mfaSecretEncrypted);",
                  "    const counter = Math.floor(Date.now() / 1000 / TOTP_PERIOD);",
                  "    const token = generateTOTP(secret, counter);",
                  "    const verified = await mfaVerify(mockReq({",
                  "      body: { challengeToken: initial.challengeToken, token }",
                  "    }));",
                  "    if (verified.error) return verified;",
                  "    return {",
                  "      ...verified,",
                  "      refreshToken: initial.refreshToken,",
                  "      session: initial.session",
                  "    };",
                  "  }",
                  "",
                  "  // 1"
              ])
          )
          sub_once(
              platform_auth_test,
              r'  await testAsync\("login correcto", async \(\) => \{\n    const \{ login \} = require\("\.\./src/modules/platform/platform-auth-service"\);\n    loginResult = await login\("auth-test@manecomb\.com", TEST_PASSWORD, req\);',
              '  await testAsync("login correcto", async () => {\n    loginResult = await loginWithMfa("auth-test@manecomb.com", TEST_PASSWORD);'
          )
          sub_once(
              platform_auth_test,
              r'  await testAsync\("logout-all", async \(\) => \{\n    const \{ login, logoutAll \} = require\("\.\./src/modules/platform/platform-auth-service"\);\n    const fresh = await login\("owner@manecomb\.com", TEST_PASSWORD, req\);',
              '  await testAsync("logout-all", async () => {\n    const { logoutAll } = require("../src/modules/platform/platform-auth-service");\n    const fresh = await loginWithMfa("owner@manecomb.com", TEST_PASSWORD);'
          )
          sub_once(
              platform_auth_test,
              r'  await testAsync\("login owner", async \(\) => \{\n    const \{ login \} = require\("\.\./src/modules/platform/platform-auth-service"\);\n    const r = await login\("owner@manecomb\.com", TEST_PASSWORD, req\);',
              '  await testAsync("login owner", async () => {\n    const r = await loginWithMfa("owner@manecomb.com", TEST_PASSWORD);'
          )
          sub_once(
              platform_auth_test,
              r'  await testAsync\("correo normalizado", async \(\) => \{\n    const \{ login \} = require\("\.\./src/modules/platform/platform-auth-service"\);\n    const r = await login\("AUTH-TEST@manecomb\.com", TEST_PASSWORD, req\);',
              '  await testAsync("correo normalizado", async () => {\n    const r = await loginWithMfa("AUTH-TEST@manecomb.com", TEST_PASSWORD);'
          )
          replace_once(
              platform_auth_test,
              "  // 40 — env.js no bloquea inicio por PLATFORM_JWT_SECRET faltante\n  test(\"env.js no tira error sin PLATFORM_JWT_SECRET\", () => {",
              "  // 40 — env.js expone el contrato Platform; la validación productiva vive en platform-security\n  test(\"env.js expone las variables Platform\", () => {"
          )

          platform_mfa_test = "backend/test/platform-mfa.test.js"
          replace_once(
              platform_mfa_test,
              "test(\"fail-closed: isMfaOperational false sin clave\", () => {\n  assert.ok(!mfaServiceEmpty.isMfaOperational());\n});\n\n// Now reload with valid key for remaining tests",
              "\n".join([
                  "test(\"fail-closed: isMfaOperational false sin clave\", () => {",
                  "  assert.ok(!mfaServiceEmpty.isMfaOperational());",
                  "});",
                  "",
                  "const failClosedStore = createEmbeddedStore();",
                  "const failClosedUser = failClosedStore.createPlatformUser({",
                  "  name: \"Fail Closed Admin\",",
                  "  email: \"fail-closed@manecomb.com\",",
                  "  password: \"Test@1234!secure\",",
                  "  role: \"platform_admin\"",
                  "});",
                  "const failClosedReq = {",
                  "  headers: { \"user-agent\": \"fail-closed-test\" },",
                  "  ip: \"127.0.0.1\",",
                  "  app: { locals: { store: failClosedStore } },",
                  "  body: {}",
                  "};",
                  "const failClosedAuthService = require(\"../src/modules/platform/platform-auth-service\");",
                  "let failClosedRefreshToken;",
                  "",
                  "await testAsync(\"fail-closed: login válido responde 503 sin llave MFA\", async () => {",
                  "  const result = await failClosedAuthService.login(\"fail-closed@manecomb.com\", \"Test@1234!secure\", failClosedReq);",
                  "  assert.equal(result.status, 503);",
                  "  assert.equal(result.error, \"Autenticación de plataforma no disponible\");",
                  "  assert.equal(result.token, undefined);",
                  "  assert.equal(result.challengeToken, undefined);",
                  "  assert.equal(result.refreshToken, undefined);",
                  "  assert.equal(result.session, undefined);",
                  "});",
                  "",
                  "await testAsync(\"fail-closed: middleware responde 503 aunque la sesión figure verificada\", async () => {",
                  "  const created = await createPlatformSession(failClosedUser.id, failClosedReq);",
                  "  failClosedRefreshToken = created.refreshToken;",
                  "  await markPlatformSessionMfaVerified(created.session.id);",
                  "  const token = signPlatformToken(failClosedUser, created.session.id);",
                  "  const { platformAuth: platformAuthWithoutMfa } = require(\"../src/middlewares/platform-auth\");",
                  "  const authReq = {",
                  "    ...failClosedReq,",
                  "    headers: { authorization: `Bearer ${token}`, \"user-agent\": \"fail-closed-test\" }",
                  "  };",
                  "  const authRes = mockRes();",
                  "  let nextCalled = false;",
                  "  await platformAuthWithoutMfa(authReq, authRes, () => { nextCalled = true; });",
                  "  assert.equal(nextCalled, false);",
                  "  assert.equal(authRes.state.statusCode, 503);",
                  "});",
                  "",
                  "await testAsync(\"fail-closed: refresh responde 503 sin rotar el token\", async () => {",
                  "  const result = await failClosedAuthService.refresh(failClosedRefreshToken, failClosedReq);",
                  "  assert.equal(result.status, 503);",
                  "  assert.equal(result.error, \"Autenticación de plataforma no disponible\");",
                  "  assert.equal(result.refreshToken, undefined);",
                  "});",
                  "",
                  "// Now reload with valid key for remaining tests"
              ])
          )
          replace_once(
              platform_mfa_test,
              "const platformAuthService = require(\"../src/modules/platform/platform-auth-service\");\nconst mfaCrypto = require(\"../src/utils/platform-mfa-crypto\");",
              "const platformAuthService = require(\"../src/modules/platform/platform-auth-service\");\nconst mfaCrypto = require(\"../src/utils/platform-mfa-crypto\");\n\nawait testAsync(\"fail-closed: refresh original sigue válido después de restaurar MFA\", async () => {\n  const result = await platformAuthService.refresh(failClosedRefreshToken, failClosedReq);\n  assert.ok(result.token);\n  assert.ok(result.refreshToken);\n  assert.notEqual(result.refreshToken, failClosedRefreshToken);\n});"
          )

          write("backend/test/platform-security-config.test.js", "\n".join([
              "const assert = require(\"node:assert/strict\");",
              "const {",
              "  PlatformSecurityConfigurationError,",
              "  isValidPlatformJwtSecret,",
              "  isValidPlatformMfaEncryptionKey,",
              "  getPlatformSecurityStatus,",
              "  assertPlatformSecurityConfiguration",
              "} = require(\"../src/config/platform-security\");",
              "",
              "const VALID_JWT = \"platform-test-jwt-secret-with-more-than-32-characters\";",
              "const VALID_MFA = \"MinzFLmGlxqwGor12GdyXqZYsRea/r+QAWuVhEvPMRg=\";",
              "",
              "assert.equal(isValidPlatformJwtSecret(VALID_JWT), true);",
              "assert.equal(isValidPlatformJwtSecret(\"short\"), false);",
              "assert.equal(isValidPlatformMfaEncryptionKey(VALID_MFA), true);",
              "assert.equal(isValidPlatformMfaEncryptionKey(\"not-base64\"), false);",
              "assert.equal(isValidPlatformMfaEncryptionKey(Buffer.alloc(31).toString(\"base64\")), false);",
              "",
              "const ready = getPlatformSecurityStatus({ jwtSecret: VALID_JWT, mfaEncryptionKey: VALID_MFA });",
              "assert.deepEqual(ready, {",
              "  configured: true,",
              "  jwtConfigured: true,",
              "  mfaConfigured: true,",
              "  jwtReady: true,",
              "  mfaReady: true,",
              "  ready: true",
              "});",
              "",
              "const disabled = assertPlatformSecurityConfiguration({ production: true, jwtSecret: \"\", mfaEncryptionKey: \"\" });",
              "assert.equal(disabled.configured, false);",
              "assert.equal(disabled.ready, false);",
              "",
              "assert.throws(",
              "  () => assertPlatformSecurityConfiguration({ production: true, jwtSecret: VALID_JWT, mfaEncryptionKey: \"\" }),",
              "  (error) => error instanceof PlatformSecurityConfigurationError && error.statusCode === 503",
              ");",
              "assert.throws(",
              "  () => assertPlatformSecurityConfiguration({ production: true, jwtSecret: \"\", mfaEncryptionKey: VALID_MFA }),",
              "  (error) => error.code === \"PLATFORM_SECURITY_CONFIGURATION_INVALID\"",
              ");",
              "assert.throws(",
              "  () => assertPlatformSecurityConfiguration({ production: true, jwtSecret: \"short\", mfaEncryptionKey: VALID_MFA }),",
              "  PlatformSecurityConfigurationError",
              ");",
              "",
              "const developmentPartial = assertPlatformSecurityConfiguration({ production: false, jwtSecret: VALID_JWT, mfaEncryptionKey: \"\" });",
              "assert.equal(developmentPartial.configured, true);",
              "assert.equal(developmentPartial.ready, false);",
              "",
              "console.log(\"ok - platform security configuration is fail-closed\");",
              ""
          ]))

          contract = "scripts/validate-environment-contract.mjs"
          replace_once(
              contract,
              "if (backend.get('CLIENT_ORIGIN')?.includes('*') && !backend.get('CLIENT_ORIGIN')?.includes('*.manecomb1.pages.dev')) {\n  fail('backend/.env.example: CLIENT_ORIGIN no debe usar wildcard global');\n}\n\nfor (const [name, entries] of [",
