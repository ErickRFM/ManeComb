          const dockerfile = read('backend/Dockerfile');'''
          )

          write("RC-ADM-GLOBAL-P0.md", '''# ADM-GLOBAL-P0 — Seguridad fail-closed y cobertura obligatoria

          **Rama:** `fix/adm-global-p0-security`  
          **Estado:** implementación técnica cerrada; pendiente de merge y validación operativa  
          **Alcance:** autenticación Platform, MFA, configuración productiva, CORS y CI

          ## Problema corregido

          La política anterior calculaba MFA como requerido únicamente cuando la llave de cifrado estaba operativa. Si `PLATFORM_MFA_ENCRYPTION_KEY` faltaba o era inválida, un usuario Platform con contraseña válida podía recibir un access token completo y el middleware omitía la verificación MFA.

          ## Cierre aplicado

          - El login determina primero si el rol requiere MFA y responde `503` cuando el servicio MFA no está operativo.
          - No se crea ni se entrega una sesión durante esa denegación.
          - El refresh valida MFA antes de rotar el refresh token.
          - El middleware responde `503` ante configuración MFA inválida, incluso si una sesión antigua figura como verificada.
          - `requireMfa` también falla cerrado.
          - La configuración productiva aborta ante secretos Platform parciales o inválidos; si ambos están ausentes, Admin Global permanece deshabilitado y sus endpoints responden `503` sin derribar el resto de ManeComb.
          - CORS contempla `admin.manecomb.com` y el puerto local `5174`.
          - Las suites `platform-auth`, `platform-mfa`, `platform-api-base` y `platform-security-config` son parte obligatoria de `npm test`.
          - El contrato de entorno detecta la reaparición del patrón fail-open o la exclusión de pruebas Platform.

          ## Validación requerida antes de despliegue

          1. Confirmar `PLATFORM_JWT_SECRET` de al menos 32 caracteres.
          2. Confirmar `PLATFORM_MFA_ENCRYPTION_KEY` como Base64 canónico de 32 bytes.
          3. Confirmar que el primer `platform_owner` existe en la base productiva correcta.
          4. Confirmar `https://admin.manecomb.com` en el `CLIENT_ORIGIN` real de Render.
          5. Probar login, enrolamiento TOTP, recuperación, refresh y revocación con Mongo real.

          No se modificaron secretos, MongoDB, Render, Cloudflare ni Producción desde esta rama.
          ''')

          workflow = Path(".github/workflows/_temporary-adm-global-p0.yml")
          workflow.unlink()
          PY

      - name: Install backend dependencies
        run: |
          npm ci --prefix communication-service
          npm ci --prefix backend --ignore-scripts

      - name: Run Platform security suites
        run: npm run test:platform --prefix backend

      - name: Run environment contract
        run: node scripts/validate-environment-contract.mjs

      - name: Commit verified P0 closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(platform): enforce MFA fail-closed"
          git push origin HEAD:fix/adm-global-p0-security
