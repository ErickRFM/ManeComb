          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          platform_auth_test = "backend/test/platform-auth.test.js"
          replace_once(
              platform_auth_test,
              '''process.env.MONGO_URI = "";
          process.env.MONGODB_URI = "";''',
              '''process.env.MONGO_URI = "";
          process.env.MONGODB_URI = "";
          process.env.PLATFORM_MFA_ENCRYPTION_KEY = "MinzFLmGlxqwGor12GdyXqZYsRea/r+QAWuVhEvPMRg=";'''
          )
          replace_once(
              platform_auth_test,
              '''const assert = require("node:assert/strict");
          const jwt = require("jsonwebtoken");''',
              '''const assert = require("node:assert/strict");
          const jwt = require("jsonwebtoken");
          const { encrypt, decrypt } = require("../src/utils/platform-mfa-crypto");
          const { generateBase32Secret, generateTOTP, TOTP_PERIOD } = require("../src/utils/platform-totp");
          const { mfaVerify } = require("../src/modules/platform/platform-mfa-service");'''
          )
          replace_once(
              platform_auth_test,
              '''    platformSession: overrides?.platformSession || null,
              platformAuth: overrides?.platformAuth || null
            };''',
              '''    platformSession: overrides?.platformSession || null,
              platformAuth: overrides?.platformAuth || null,
              body: overrides?.body || {}
            };'''
          )
          replace_once(
              platform_auth_test,
              '''  store.updatePlatformUser(lockedUser.id, { failedLoginAttempts: 5, lockedUntil: new Date(Date.now() + 3600000) });
            req = mockReq();

            // 1''',
              '''  store.updatePlatformUser(lockedUser.id, { failedLoginAttempts: 5, lockedUntil: new Date(Date.now() + 3600000) });
            req = mockReq();

            function enableMfa(email) {
              const user = store.getPlatformUserByEmail(email);
              const secret = generateBase32Secret();
              store.updatePlatformUser(user.id || user._id, {
                mfaEnabled: true,
                mfaEnrollmentRequired: false,
                mfaSecretEncrypted: encrypt(secret),
                mfaBackupCodes: []
              });
            }

            enableMfa("auth-test@manecomb.com");
            enableMfa("owner@manecomb.com");

            async function loginWithMfa(email, password) {
              const { login } = require("../src/modules/platform/platform-auth-service");
              const initial = await login(email, password, req);
              if (initial.error) return initial;

              assert.ok(initial.mfaRequired);
              assert.ok(initial.challengeToken);
              assert.ok(!initial.token);

              const user = store.getPlatformUserByEmail(String(email).trim().toLowerCase());
              const secret = decrypt(user.mfaSecretEncrypted);
              const counter = Math.floor(Date.now() / 1000 / TOTP_PERIOD);
              const token = generateTOTP(secret, counter);
              const verified = await mfaVerify(mockReq({
                body: { challengeToken: initial.challengeToken, token }
              }));
              if (verified.error) return verified;

              return {
                ...verified,
                refreshToken: initial.refreshToken,
                session: initial.session
              };
            }

            // 1'''
          )
          replace_once(
              platform_auth_test,
              '''  await testAsync("login correcto", async () => {
              const { login } = require("../src/modules/platform/platform-auth-service");
              loginResult = await login("auth-test@manecomb.com", TEST_PASSWORD, req);''',
              '''  await testAsync("login correcto", async () => {
              loginResult = await loginWithMfa("auth-test@manecomb.com", TEST_PASSWORD);'''
          )
          replace_once(
              platform_auth_test,
              '''  await testAsync("logout-all", async () => {
              const { login, logoutAll } = require("../src/modules/platform/platform-auth-service");
              const fresh = await login("owner@manecomb.com", TEST_PASSWORD, req);''',
              '''  await testAsync("logout-all", async () => {
              const { logoutAll } = require("../src/modules/platform/platform-auth-service");
              const fresh = await loginWithMfa("owner@manecomb.com", TEST_PASSWORD);'''
          )
          replace_once(
              platform_auth_test,
              '''  await testAsync("login owner", async () => {
              const { login } = require("../src/modules/platform/platform-auth-service");
              const r = await login("owner@manecomb.com", TEST_PASSWORD, req);''',
              '''  await testAsync("login owner", async () => {
              const r = await loginWithMfa("owner@manecomb.com", TEST_PASSWORD);'''
          )
          replace_once(
              platform_auth_test,
              '''  await testAsync("correo normalizado", async () => {
              const { login } = require("../src/modules/platform/platform-auth-service");
              const r = await login("AUTH-TEST@manecomb.com", TEST_PASSWORD, req);''',
              '''  await testAsync("correo normalizado", async () => {
              const r = await loginWithMfa("AUTH-TEST@manecomb.com", TEST_PASSWORD);'''
          )
          replace_once(
              platform_auth_test,
              '''  // 40 — env.js no bloquea inicio por PLATFORM_JWT_SECRET faltante
            test("env.js no tira error sin PLATFORM_JWT_SECRET", () => {''',
              '''  // 40 — env.js expone el contrato Platform; la validación productiva vive en platform-security
            test("env.js expone las variables Platform", () => {'''
          )

          platform_mfa_test = "backend/test/platform-mfa.test.js"
          replace_once(
              platform_mfa_test,
              '''test("fail-closed: isMfaOperational false sin clave", () => {
            assert.ok(!mfaServiceEmpty.isMfaOperational());
          });

          // Now reload with valid key for remaining tests''',
              '''test("fail-closed: isMfaOperational false sin clave", () => {
            assert.ok(!mfaServiceEmpty.isMfaOperational());
          });

          const failClosedStore = createEmbeddedStore();
          const failClosedUser = failClosedStore.createPlatformUser({
            name: "Fail Closed Admin",
            email: "fail-closed@manecomb.com",
            password: "Test@1234!secure",
            role: "platform_admin"
          });
          const failClosedReq = {
            headers: { "user-agent": "fail-closed-test" },
            ip: "127.0.0.1",
            app: { locals: { store: failClosedStore } },
            body: {}
          };
          const failClosedAuthService = require("../src/modules/platform/platform-auth-service");
          let failClosedRefreshToken;

          await testAsync("fail-closed: login válido responde 503 sin llave MFA", async () => {
            const result = await failClosedAuthService.login(
              "fail-closed@manecomb.com",
              "Test@1234!secure",
              failClosedReq
            );
            assert.equal(result.status, 503);
            assert.equal(result.error, "Autenticación de plataforma no disponible");
            assert.equal(result.token, undefined);
            assert.equal(result.challengeToken, undefined);
            assert.equal(result.refreshToken, undefined);
            assert.equal(result.session, undefined);
          });

          await testAsync("fail-closed: middleware responde 503 aunque la sesión figure verificada", async () => {
            const created = await createPlatformSession(failClosedUser.id, failClosedReq);
            failClosedRefreshToken = created.refreshToken;
            await markPlatformSessionMfaVerified(created.session.id);
            const token = signPlatformToken(failClosedUser, created.session.id);
            const { platformAuth: platformAuthWithoutMfa } = require("../src/middlewares/platform-auth");
            const authReq = {
              ...failClosedReq,
              headers: { authorization: `Bearer ${token}`, "user-agent": "fail-closed-test" }
            };
            const authRes = mockRes();
            let nextCalled = false;
            await platformAuthWithoutMfa(authReq, authRes, () => { nextCalled = true; });
            assert.equal(nextCalled, false);
            assert.equal(authRes.state.statusCode, 503);
          });

          await testAsync("fail-closed: refresh responde 503 sin rotar el token", async () => {
            const result = await failClosedAuthService.refresh(failClosedRefreshToken, failClosedReq);
            assert.equal(result.status, 503);
            assert.equal(result.error, "Autenticación de plataforma no disponible");
            assert.equal(result.refreshToken, undefined);
          });

          // Now reload with valid key for remaining tests'''
          )
          replace_once(
              platform_mfa_test,
              '''const platformAuthService = require("../src/modules/platform/platform-auth-service");
          const mfaCrypto = require("../src/utils/platform-mfa-crypto");''',
              '''const platformAuthService = require("../src/modules/platform/platform-auth-service");
          const mfaCrypto = require("../src/utils/platform-mfa-crypto");

          await testAsync("fail-closed: el refresh original sigue válido después de restaurar MFA", async () => {
            const result = await platformAuthService.refresh(failClosedRefreshToken, failClosedReq);
            assert.ok(result.token);
            assert.ok(result.refreshToken);
            assert.notEqual(result.refreshToken, failClosedRefreshToken);
          });'''
