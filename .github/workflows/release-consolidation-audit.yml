name: Release consolidation audit

on:
  push:
    branches:
      - release/consolidation-20260805
    paths:
      - .github/workflows/release-consolidation-audit.yml

permissions:
  contents: read

jobs:
  audit-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch
        shell: bash
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Classify branches against main
        shell: bash
        run: |
          set -euo pipefail
          printf '# ManeComb branch consolidation audit\n\n' | tee branch-audit.md
          printf 'Base main: `%s`\n\n' "$(git rev-parse origin/main)" | tee -a branch-audit.md
          printf '| Branch | Ahead | Behind | Classification |\n' | tee -a branch-audit.md
          printf '|---|---:|---:|---|\n' | tee -a branch-audit.md

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in
              HEAD|main|release/consolidation-20260805) continue ;;
            esac

            counts="$(git rev-list --left-right --count origin/main..."$ref")"
            behind="${counts%%[[:space:]]*}"
            ahead="${counts##*[[:space:]]}"

            if [ "$ahead" -eq 0 ]; then
              classification='already-contained'
            elif [ "$behind" -eq 0 ]; then
              classification='clean-ahead'
            else
              classification='diverged-review-required'
            fi

            printf '| `%s` | %s | %s | %s |\n' "$branch" "$ahead" "$behind" "$classification" | tee -a branch-audit.md
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)

          cat branch-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: release-branch-audit
          path: branch-audit.md
          if-no-files-found: error
