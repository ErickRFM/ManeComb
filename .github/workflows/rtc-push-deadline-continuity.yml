name: RTC push deadline continuity codemod

on:
  push:
    branches:
      - fix/rtc-push-deadline-continuity

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message != 'rtc push deadline continuity generated'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/rtc-push-deadline-continuity
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply deterministic migration
        run: node scripts/apply-rtc-push-deadline-continuity.js
      - name: Validate generated JavaScript
        run: |
          node --check backend/src/services/fcm-notifier.js
          node --check backend/src/services/rtc-call-service.js
          node --check backend/test/fcm-notifier.test.js
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run focused backend regression
        run: node --require ./test/setup-env.js test/fcm-notifier.test.js
        working-directory: backend
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Run focused Android/JS regressions
        working-directory: mobile
        run: npx jest src/navigation/android-runtime-hardening.test.ts src/features/calls/call-push-intent.test.ts --runInBand
      - name: Commit generated migration
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git add backend/src/services/fcm-notifier.js backend/src/services/rtc-call-service.js backend/test/fcm-notifier.test.js mobile/android/app/src/main/java/com/anonymous/combiscontrol/notifications/ManeCombPushNotificationRenderer.kt mobile/src/navigation/android-runtime-hardening.test.ts
          git commit -m "rtc push deadline continuity generated"
          git push origin HEAD:fix/rtc-push-deadline-continuity
