name: Temporary reconcile Mobile #209

on:
  push:
    branches:
      - agent/mobile-lifecycle-hardening-20260815

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/mobile-lifecycle-hardening-20260815
          fetch-depth: 0

      - name: Preserve session hardening and retire operational legacy
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('mobile/src/store/root-store.ts')
          text = path.read_text(encoding='utf-8-sig')

          def sub_once(pattern, repl, label):
              global text
              text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')

          sub_once(
              r'\nfunction applyIncidentToMapData\(.*?\n\}\n\n(?=function mergeConversationMessages)',
              '\n',
              'applyIncidentToMapData authority',
          )
          sub_once(
              r"\n  sessionSocket\.on\('location:updated',.*?\n  \}\);\n\n(?=  // Snapshot canonico completo)",
              '\n',
              'location:updated listener',
          )
          sub_once(
              r'\n      if \(data\.mapData\?\.vehicles\) \{.*?\n      \}\n(?=      set\(\{ \.\.\.data)',
              '\n',
              'mapData live vehicle merge',
          )

          text, incident_mirror_count = re.subn(
              r'^\s*mapData: applyIncidentToMapData\(s\.mapData, incident\),\n',
              '',
              text,
              flags=re.M,
          )
          if incident_mirror_count != 4:
              raise SystemExit(
                  f'incident mapData mirror: expected 4 removals, got {incident_mirror_count}'
              )

          forbidden = [
              "socket.on('location:updated'",
              "sessionSocket.on('location:updated'",
              'applyIncidentToMapData',
          ]
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit(f'legacy authority remains: {present}')

          required = [
              'isSocketSessionCurrent',
              'captureSessionIdentity',
              'beginSessionEpoch()',
              'logoutRequest(rt, pushTokenForLogout)',
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f'session hardening lost: {missing}')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow and commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-reconcile-mobile-209.yml
          git diff --check
          git diff --exit-code -- .github/workflows/temp-reconcile-mobile-209.yml >/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/store/root-store.ts .github/workflows/temp-reconcile-mobile-209.yml
          git commit -m "fix(mobile): reconcile session lifecycle with operational authority"
          git push origin HEAD:agent/mobile-lifecycle-hardening-20260815
