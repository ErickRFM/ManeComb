name: Apply RTC call ring restoration

on:
  push:
    branches:
      - fix/mobile-server-banner-auth-20260805

permissions:
  contents: write

concurrency:
  group: rtc-call-ring-restoration
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/mobile-server-banner-auth-20260805
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Apply deterministic restoration
        run: node scripts/apply-rtc-call-ring-restoration.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Lint restored mobile surface
        working-directory: mobile
        run: npx eslint src/screens/chat/hooks/use-chat-controller.ts src/screens/chat/components/chat-screen-view.tsx src/screens/chat/components/incoming-call-modal.tsx src/screens/chat/types.ts

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Commit validated restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(rtc): restore incoming call ring and acceptance flow"
          git push origin HEAD:fix/mobile-server-banner-auth-20260805
