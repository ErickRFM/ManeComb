name: Temporary semantic audit refresh for #226

on:
  push:
    branches:
      - reconcile/mobile-lifecycle-main-20260818

permissions:
  contents: write

jobs:
  refresh-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final Mobile reconciliation
        uses: actions/checkout@v5
        with:
          ref: reconcile/mobile-lifecycle-main-20260818
          fetch-depth: 0

      - name: Refresh audited authorities to current main
        shell: python
        run: |
          from pathlib import Path
          import json

          main_sha = '110ae1d11c63b933be1cd5f5d3de1346b62e8f91'
          captured_at = '2026-08-18'

          gates_path = Path('docs/architecture/system-audit-gates.json')
          gates = json.loads(gates_path.read_text(encoding='utf-8'))
          gates['baseline']['branch'] = 'main'
          gates['baseline']['commit'] = main_sha
          gates['baseline']['capturedAt'] = captured_at
          if gates.get('maxBaselineDriftCommits') != 5 or gates.get('maxAuthorityMapDriftCommits') != 5:
              raise SystemExit('Audit drift thresholds changed unexpectedly; refusing refresh')
          gates_path.write_text(json.dumps(gates, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          authorities_path = Path('docs/architecture/system-authorities.json')
          doc = json.loads(authorities_path.read_text(encoding='utf-8'))
          doc['baseline']['branch'] = 'main'
          doc['baseline']['commit'] = main_sha
          doc['baseline']['capturedAt'] = captured_at
          doc['baseline']['phase'] = 'post-portal-media-offline-and-mobile-session-lifecycle-reconciliation'

          authorities = doc.get('authorities', [])
          by_id = {entry.get('id'): entry for entry in authorities}

          navigation = by_id.get('navigation')
          if not navigation:
              raise SystemExit('navigation authority missing')
          for path in [
              'mobile/src/api/offline-cache.ts',
              'mobile/src/services/route-session-actions.ts',
              'mobile/android/app/src/main/java/com/anonymous/combiscontrol/location/ManeCombLocationService.kt',
          ]:
              if path not in navigation['sourcePaths']:
                  navigation['sourcePaths'].append(path)

          communication = by_id.get('communication-events')
          if not communication:
              raise SystemExit('communication-events authority missing')
          for path in [
              'backend/src/services/chat-media.js',
              'ventas/features/portal/communication/authenticated-media.tsx',
          ]:
              if path not in communication['sourcePaths']:
                  communication['sourcePaths'].append(path)

          identity = by_id.get('identity')
          if not identity:
              raise SystemExit('identity authority missing')
          for path in [
              'backend/src/services/sessions.js',
              'backend/src/utils/jwt.js',
          ]:
              if path not in identity['sourcePaths']:
                  identity['sourcePaths'].append(path)

          if 'mobile-session-runtime-identity' not in by_id:
              identity_index = next(i for i, entry in enumerate(authorities) if entry.get('id') == 'identity')
              authorities.insert(identity_index + 1, {
                  'id': 'mobile-session-runtime-identity',
                  'decision': 'Which authenticated Mobile identity may still commit in-flight HTTP, SecureStore, offline replay, Socket.IO/ACK, chat and push side effects after refresh, logout or account change',
                  'owner': 'mobile',
                  'status': 'canonical',
                  'sourcePaths': [
                      'mobile/src/store/session-epoch.ts',
                      'mobile/src/api/api-session-boundary.ts',
                      'mobile/src/native/secure-store.ts',
                      'mobile/src/store/root-store.ts',
                      'backend/src/services/sessions.js',
                      'backend/src/utils/jwt.js',
                      'backend/src/modules/auth/routes.js',
                  ],
                  'consumers': ['mobile', 'backend'],
                  'targetPhase': 1,
              })

          doc['authorities'] = authorities
          authorities_path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Semantic assertions from the audited 12-commit delta + #226.
          required = {
              'navigation': 'mobile/src/api/offline-cache.ts',
              'communication-events': 'backend/src/services/chat-media.js',
              'identity': 'backend/src/services/sessions.js',
              'mobile-session-runtime-identity': 'mobile/src/store/session-epoch.ts',
          }
          after = {entry.get('id'): entry for entry in doc['authorities']}
          for authority_id, source_path in required.items():
              if source_path not in after[authority_id]['sourcePaths']:
                  raise SystemExit(f'authority audit incomplete: {authority_id} -> {source_path}')

      - name: Remove temporary workflow and commit audited baseline
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-refresh-system-audit-226.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/system-audit-gates.json docs/architecture/system-authorities.json .github/workflows/temp-refresh-system-audit-226.yml
          git commit -m "docs(audit): refresh semantic authorities for final mobile reconciliation"
          git push origin HEAD:reconcile/mobile-lifecycle-main-20260818
