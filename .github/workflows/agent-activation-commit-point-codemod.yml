name: Agent activation commit point codemod

on:
  push:
    branches:
      - agent/activation-key-rollback-20260809
    paths:
      - .github/workflows/agent-activation-commit-point-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/activation-key-rollback-20260809
          fetch-depth: 0

      - name: Apply activation commit point edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing expected snippet: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected one occurrence but found multiple: ${label}`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          const servicePath = 'backend/src/services/activation-keys.js';
          let source = fs.readFileSync(servicePath, 'utf8');

          source = replaceOnce(
            source,
            `const { validatePasswordStrength } = require("../utils/password-policy");\nconst { buildSubscription, pickActiveOrder } = require("./portal-account");`,
            `const { validatePasswordStrength } = require("../utils/password-policy");\nconst logger = require("./logger");\nconst { buildSubscription, pickActiveOrder } = require("./portal-account");`,
            'logger import'
          );

          source = replaceOnce(
            source,
            `  const selectedVehicle = await claimSelectedUnit(store, payload, context.companyId, driverId);\n\n  try {`,
            `  const selectedVehicle = await claimSelectedUnit(store, payload, context.companyId, driverId);\n  let userPersisted = false;\n\n  try {`,
            'user persistence commit flag'
          );

          source = replaceOnce(
            source,
            `    const user = existingUser\n      ? await store.updateUser(existingUser.id, userPayload)\n      : await store.createUser(userPayload, "driver");\n\n    await updateStarterFleet(store, context.order, user, vehicle);`,
            `    const user = existingUser\n      ? await store.updateUser(existingUser.id, userPayload)\n      : await store.createUser(userPayload, "driver");\n    userPersisted = true;\n\n    try {\n      await updateStarterFleet(store, context.order, user, vehicle);\n    } catch (starterFleetError) {\n      logger.warn({\n        action: "StarterFleetSync",\n        module: "ActivationKeys",\n        organizationId: context.companyId,\n        userId: user.id,\n        status: "degraded",\n        message: "No fue posible sincronizar starterFleet despues de activar al conductor",\n        metadata: {\n          errorName: String(starterFleetError?.name || "Error").slice(0, 80)\n        }\n      });\n    }`,
            'starter fleet best effort after commit'
          );

          source = replaceOnce(
            source,
            `    const compensations = [];\n\n    if (typeof store.updateActivationKey === "function") {`,
            `    const compensations = [];\n\n    if (!userPersisted && typeof store.updateActivationKey === "function") {`,
            'key compensation only before commit'
          );

          source = replaceOnce(
            source,
            `    if (selectedVehicle && typeof store.releaseVehicleFromDriver === "function") {`,
            `    if (!userPersisted && selectedVehicle && typeof store.releaseVehicleFromDriver === "function") {`,
            'vehicle compensation only before commit'
          );

          fs.writeFileSync(servicePath, source);
          NODE

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run activation rollback regression
        working-directory: backend
        run: node --require ./test/setup-env.js test/activation-key-rollback.test.js

      - name: Commit codemod
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/activation-keys.js
          git commit -m "fix(activation): define driver registration commit point"
          git push origin HEAD:agent/activation-key-rollback-20260809
