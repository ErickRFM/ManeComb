name: Integrate communication closure with main

on:
  push:
    branches:
      - agent/communication-closure

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/communication-closure
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Merge latest main selectively
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OLD_HEAD=$(git rev-parse HEAD)
          git fetch origin main
          git merge --no-commit -X theirs origin/main
          git checkout "$OLD_HEAD" -- mobile/src/screens/chat/hooks/use-chat-controller.ts
          git checkout "$OLD_HEAD" -- mobile/src/screens/chat/components/chat-screen-view.tsx
          git checkout "$OLD_HEAD" -- mobile/src/screens/chat/components/message-media.tsx
          git checkout "$OLD_HEAD" -- mobile/src/screens/chat/types.ts
          python scripts/sync-communication-main.py
          git rm -f .github/workflows/communication-sync-main.yml scripts/sync-communication-main.py
          if grep -R -n -E 'RTCPeerConnection|peerRef|joinedRtcRoomRef|localStreamRef|rtc:offer|rtc:answer|rtc:ice-candidate' mobile/src/screens/chat; then
            echo 'Legacy RTC ownership remains in Chat' >&2
            exit 1
          fi
          if grep -R -n 'CallMediaTile' mobile/src/screens/chat; then
            echo 'Legacy CallMediaTile remains in Chat' >&2
            exit 1
          fi
          test "$(grep -R -h 'function buildChatMessageId' backend/src | wc -l)" -eq 1
          grep -q 'emitAcceptWithAck' mobile/src/features/calls/call-signaling.ts
          grep -q 'restartIce' mobile/src/features/calls/call-runtime.ts
          git diff --check
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Install mobile
        working-directory: mobile
        run: npm ci
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck
      - name: Lint mobile
        working-directory: mobile
        run: npm run lint
      - name: Test mobile
        working-directory: mobile
        run: npm test -- --runInBand
      - name: Commit integrated closure
        shell: bash
        run: |
          git add -A
          git commit -m "merge: integrate communication closure with latest main"
          git push origin HEAD:agent/communication-closure
