name: Integrate communication closure with main

on:
  push:
    branches:
      - agent/communication-closure

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/communication-closure
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Merge latest main selectively
        shell: bash
        run: |
          OLD_HEAD=$(git rev-parse HEAD)
          git fetch origin main
          git merge --no-commit -X theirs origin/main

          # Chat stays physically free of the legacy RTC owner. The new main
          # runtime/overlay wins for all features/calls and native RTC files.
          git checkout "$OLD_HEAD" -- \
            mobile/src/screens/chat/hooks/use-chat-controller.ts \
            mobile/src/screens/chat/components/chat-screen-view.tsx \
            mobile/src/screens/chat/components/message-media.tsx \
            mobile/src/screens/chat/types.ts

          python - <<'PY'
          from pathlib import Path
          import json

          controller = Path('mobile/src/screens/chat/hooks/use-chat-controller.ts')
          text = controller.read_text()
          text = text.replace(
              "        mode,\n        peerName: activeConversation.title,\n",
              "        mode,\n",
              1,
          )
          controller.write_text(text)

          modal = Path('mobile/src/features/calls/components/active-call-modal.tsx')
          text = modal.read_text()
          store_import = "import { useCallStore } from '../call-store';"
          if store_import not in text:
              raise SystemExit('ActiveCallModal store import not found')
          text = text.replace(
              store_import,
              "import { useAppStore } from '@/src/store/use-app-store';\n" + store_import,
              1,
          )
          old_state = """  const callerName = useCallStore((state) => state.callerName);
  const direction = useCallStore((state) => state.direction);"""
          new_state = """  const callerName = useCallStore((state) => state.callerName);
  const conversationId = useCallStore((state) => state.conversationId);
  const direction = useCallStore((state) => state.direction);
  const conversations = useAppStore((state) => state.conversations);
  const currentUserId = useAppStore((state) => state.user?.id || null);"""
          if old_state not in text:
              raise SystemExit('ActiveCallModal state anchor not found')
          text = text.replace(old_state, new_state, 1)
          old_title = """  const title = direction === 'incoming'
    ? callerName || 'Contacto operativo'
    : 'Contacto operativo';"""
          new_title = """  const conversation = conversations.find((entry) => entry.id === conversationId) || null;
  const peer = conversation?.participants.find((participant) => participant.id !== currentUserId) || null;
  const title = callerName || peer?.name || conversation?.title || 'Contacto operativo';"""
          if old_title not in text:
              raise SystemExit('ActiveCallModal title anchor not found')
          text = text.replace(old_title, new_title, 1)
          modal.write_text(text)

          package_file = Path('mobile/package.json')
          package_data = json.loads(package_file.read_text())
          command = package_data['scripts']['test']
          anchor = 'src/utils/chat-e2ee.test.ts'
          additions = 'src/utils/chat-message-id.test.ts src/utils/chat-pagination.test.ts '
          if 'src/utils/chat-message-id.test.ts' not in command:
              if anchor not in command:
                  raise SystemExit('mobile test anchor missing')
              command = command.replace(anchor, additions + anchor, 1)
          package_data['scripts']['test'] = command
          package_file.write_text(json.dumps(package_data, indent=2, ensure_ascii=False) + '\n')
          PY

          git rm -f .github/workflows/communication-sync-main.yml

          # Structural gate: Chat may request a call, but may not own RTC.
          if grep -R -n -E 'RTCPeerConnection|peerRef|joinedRtcRoomRef|localStreamRef|rtc:offer|rtc:answer|rtc:ice-candidate' mobile/src/screens/chat; then
            echo 'Legacy RTC ownership remains in Chat' >&2
            exit 1
          fi
          if grep -R -n 'CallMediaTile' mobile/src/screens/chat; then
            echo 'Legacy CallMediaTile remains in Chat' >&2
            exit 1
          fi
          test "$(grep -R -h 'function buildChatMessageId' backend/src | wc -l)" -eq 1
          grep -q 'emitAcceptWithAck' mobile/src/features/calls/call-signaling.ts
          grep -q 'restartIce' mobile/src/features/calls/call-runtime.ts
          git diff --check
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Install mobile
        working-directory: mobile
        run: npm ci
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck
      - name: Lint mobile
        working-directory: mobile
        run: npm run lint
      - name: Test mobile
        working-directory: mobile
        run: npm test -- --runInBand
      - name: Commit integrated closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "merge: integrate communication closure with latest main"
          git push origin HEAD:agent/communication-closure
