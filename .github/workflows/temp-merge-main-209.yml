name: Temporary merge main into Mobile #209

on:
  push:
    branches:
      - agent/mobile-lifecycle-hardening-20260815

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: agent/mobile-lifecycle-hardening-20260815
          fetch-depth: 0

      - name: Merge current main semantically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-commit --no-ff origin/main; then
            echo 'Conflicting files:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          rm .github/workflows/temp-merge-main-209.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(mobile): reconcile lifecycle hardening with current main"
          git push origin HEAD:agent/mobile-lifecycle-hardening-20260815
