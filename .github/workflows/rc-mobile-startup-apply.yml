name: RC Mobile Startup Apply

on:
  push:
    branches:
      - fix/mobile-startup-stability-20260806

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-startup-stability-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Apply audited startup patch
        run: python scripts/apply-mobile-startup-rc.py

      - name: Verify Mobile
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: Verify Backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Commit verified RC and remove temporary tooling
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git rm .github/workflows/rc-mobile-startup-apply.yml
          git rm .github/workflows/rc-mobile-startup-pr-trigger.yml
          git rm scripts/apply-mobile-startup-rc.py
          git add RC-MOBILE-STARTUP-STABILITY-01.md mobile
          git commit -m "fix(mobile): stabilize session startup state machine"
          git push origin HEAD:fix/mobile-startup-stability-20260806
