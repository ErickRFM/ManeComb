name: RC Mobile Startup Apply

on:
  push:
    branches:
      - fix/mobile-startup-stability-20260806

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-startup-stability-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Apply minimal startup stability patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1. Network policy: one bounded cold-start GET and no replay of rotating refresh tokens.
          replace_once(
              'mobile/src/api/client.ts',
              """    options.coldStart
              ? { params, timeout: COLD_START_SESSION_TIMEOUT_MS }
              : { params }
""",
              """    options.coldStart
              ? {
                  params,
                  timeout: COLD_START_SESSION_TIMEOUT_MS,
                  _skipNetworkRetry: true,
                } as RetryableRequestConfig
              : { params }
""",
          )
          replace_once(
              'mobile/src/api/client.ts',
              """export async function refreshSessionRequest(refreshToken: string, appVersion?: string) {
  const response = await apiClient.post<LoginResult>('/auth/refresh', {
    refreshToken,
    appVersion,
  }, {
    _allowRetry: true,
    _skipAuthRefresh: true,
  } as RetryableRequestConfig);

  return response.data;
}
""",
              """export async function refreshSessionRequest(refreshToken: string, appVersion?: string) {
  const response = await apiClient.post<LoginResult>('/auth/refresh', {
    refreshToken,
    appVersion,
  }, {
    _skipAuthRefresh: true,
    _skipNetworkRetry: true,
  } as RetryableRequestConfig);

  return response.data;
}
""",
          )

          # 2. Sync error route: only render a loader while refreshAll is actually active.
          gate = Path('mobile/src/screens/mobile-account-gate-screen.tsx')
          gate_text = gate.read_text(encoding='utf-8')
          gate_text = gate_text.replace("import { useSyncWaitStage } from '@/src/hooks/use-sync-wait-stage';\n", '')
          gate_text = gate_text.replace(
              "  const waitStage = useSyncWaitStage(reason === 'sync_error' && !isSigningOut && !error);\n",
              '',
          )
          old_gate = """  if (reason === 'sync_error' && !error && waitStage !== 'expired') {
    return <BrandSyncLoader stage={waitStage === 'slow' ? 'slow' : 'loading'} />;
  }
"""
          new_gate = """  if (reason === 'sync_error' && isRefreshing && !error) {
    return <BrandSyncLoader />;
  }
"""
          if gate_text.count(old_gate) != 1:
              raise SystemExit('mobile-account-gate-screen: loading block not found exactly once')
          gate.write_text(gate_text.replace(old_gate, new_gate, 1), encoding='utf-8')

          # 3. Root bootstrap recovery: remove the unrelated location bypass and surface terminal errors.
          app = Path('mobile/App.tsx')
          app_text = app.read_text(encoding='utf-8')
          app_text = app_text.replace('  continueLabel,\n', '')
          app_text = app_text.replace('  onContinue,\n', '')
          app_text = app_text.replace('  continueLabel?: string;\n', '')
          app_text = app_text.replace('  onContinue?: () => void;\n', '')
          app_text, conditional_count = re.subn(
              r"\n        \{onContinue \? \(.*?\n        \) : null\}",
              '',
              app_text,
              count=1,
              flags=re.S,
          )
          if conditional_count != 1:
              raise SystemExit('App.tsx: recoverable continue button block not found')
          app_text, callback_count = re.subn(
              r"\n  const continueWithoutLocation = useCallback\(\(\) => \{.*?\n  \}, \[authContext, user\]\);\n",
              '\n',
              app_text,
              count=1,
              flags=re.S,
          )
          if callback_count != 1:
              raise SystemExit('App.tsx: continueWithoutLocation callback not found')
          replace_pairs = [
              (
                  "  const { authContext, handlePushIntent, initialize, isHydrated, isBootstrapping, user } = useAppStore(\n",
                  "  const { authContext, error, handlePushIntent, initialize, isHydrated, isBootstrapping, user } = useAppStore(\n",
              ),
              (
                  "      authContext: state.authContext,\n      handlePushIntent: state.handlePushIntent,\n",
                  "      authContext: state.authContext,\n      error: state.error,\n      handlePushIntent: state.handlePushIntent,\n",
              ),
              (
                  "  const isReady = isHydrated && !isBootstrapping;\n",
                  "  const isReady = isHydrated && !isBootstrapping;\n  const bootstrapFailed = !isReady && !isBootstrapping && Boolean(error);\n",
              ),
              (
                  "                bootTimedOut ? (\n",
                  "                bootTimedOut || bootstrapFailed ? (\n",
              ),
              (
                  "                    message=\"La sesion tardo demasiado en cargar. Reintenta la sincronizacion o inicia sesion de nuevo.\"\n                    continueLabel=\"Continuar sin ubicacion\"\n                    onContinue={user ? continueWithoutLocation : undefined}\n",
                  "                    message={error || 'La sesion tardo demasiado en cargar. Reintenta la sincronizacion o inicia sesion de nuevo.'}\n",
              ),
          ]
          for old, new in replace_pairs:
              if app_text.count(old) != 1:
                  raise SystemExit(f'App.tsx: expected one match for {old[:60]!r}')
              app_text = app_text.replace(old, new, 1)
          app.write_text(app_text, encoding='utf-8')

          # 4. Store: preserve cached authority, avoid duplicate manual refresh and never fake active loading.
          store = Path('mobile/src/store/root-store.ts')
          store_text = store.read_text(encoding='utf-8')
          old_initialize = """      setAuthToken(t);
      let sessionToken = t;
      let nextRefreshToken = rt;
      let s: SessionResult;
      try {
        s = await getSessionRequest({ coldStart: true, appVersion: APP_VERSION });
      } catch (error) {
        if (isSessionEpochStale(epoch)) return;
        if (isProbablyNetworkError(error) && cached?.user) {
          set({
            ...getEmptyOperationalState(),
            connectionMode,
            token: sessionToken,
            refreshToken: nextRefreshToken,
            themeMode: th === 'dark' ? 'dark' : 'light',
            user: cached.user,
            authContext: null,
            lastCacheAt: cached.savedAt,
            isHydrated: true,
            isBootstrapping: false,
            networkStatus: 'recovering',
            error: 'No pudimos sincronizar tu cuenta. Reintenta cuando el servidor responda.',
          });
          return;
        }
        if (!rt) throw error;
        const refreshed = await refreshSessionRequest(rt, APP_VERSION);
        sessionToken = refreshed.token;
        nextRefreshToken = refreshed.refreshToken || rt;
        setAuthToken(sessionToken);
        await persistSession(sessionToken, connectionMode, nextRefreshToken);
        s = await getSessionRequest({ coldStart: true, appVersion: APP_VERSION });
      }
"""
          new_initialize = """      setAuthToken(t);
      const sessionToken = t;
      const nextRefreshToken = rt;
      let s: SessionResult;
      try {
        // `/auth/me` already owns refresh recovery through the Axios interceptor.
        // A second manual refresh here could replay a rotating refresh token.
        s = await getSessionRequest({ coldStart: true, appVersion: APP_VERSION });
      } catch (error) {
        if (isSessionEpochStale(epoch)) return;
        if (isProbablyNetworkError(error)) {
          const startupError = getReadableErrorMessage(
            error,
            'No pudimos conectar con el servidor. Reintenta cuando responda.',
            networkSnapshot
          );

          if (cached?.user) {
            const cachedState = stateFromCache(cached);
            const hasCachedAuthority = Boolean(cachedState.authContext);
            set({
              ...getEmptyOperationalState(),
              ...cachedState,
              connectionMode,
              token: sessionToken,
              refreshToken: nextRefreshToken,
              themeMode: th === 'dark' ? 'dark' : 'light',
              isHydrated: true,
              isBootstrapping: false,
              networkStatus: 'offline',
              error: hasCachedAuthority ? null : startupError,
            });
            return;
          }

          // Keep the persisted credentials available for an explicit retry, but
          // do not expose a stale Authorization header to the login screen.
          setAuthToken(null);
          set({
            ...getEmptyOperationalState(),
            connectionMode,
            token: null,
            refreshToken: null,
            authContext: null,
            user: null,
            themeMode: th === 'dark' ? 'dark' : 'light',
            isHydrated: false,
            isBootstrapping: false,
            networkStatus: 'offline',
            error: startupError,
          });
          return;
        }
        throw error;
      }
"""
          if store_text.count(old_initialize) != 1:
              raise SystemExit('root-store: initialize session block not found exactly once')
          store_text = store_text.replace(old_initialize, new_initialize, 1)

          old_signin = """      if (shouldRefreshOperationalData(authContext, session.profile.user)) {
        await get().refreshAll();
      }
"""
          new_signin = """      if (shouldRefreshOperationalData(authContext, session.profile.user)) {
        void get().refreshAll();
      }
"""
          if store_text.count(old_signin) != 1:
              raise SystemExit('root-store: signIn blocking refresh block not found')
          store_text = store_text.replace(old_signin, new_signin, 1)

          old_refresh_catch = """      if (isProbablyNetworkError(error)) {
        const cached = await loadOfflineCache().catch(() => null);
        if (isSessionEpochStale(epoch)) return;
        set({ ...stateFromCache(cached), isRefreshing: false, networkStatus: 'offline' });
        return;
      }
      set({ isRefreshing: false });
"""
          new_refresh_catch = """      if (isProbablyNetworkError(error)) {
        const cached = await loadOfflineCache().catch(() => null);
        if (isSessionEpochStale(epoch)) return;
        const cachedState = stateFromCache(cached);
        const hasAuthority = Boolean(cachedState.authContext || get().authContext);
        set({
          ...cachedState,
          isRefreshing: false,
          isHydrated: true,
          isBootstrapping: false,
          networkStatus: 'offline',
          error: hasAuthority
            ? null
            : getReadableErrorMessage(
                error,
                'No pudimos validar tu sesion. Reintenta cuando el servidor responda.',
                get().networkSnapshot
              ),
        });
        return;
      }
      set({
        isRefreshing: false,
        error: getReadableErrorMessage(
          error,
          'No pudimos sincronizar tu cuenta.',
          get().networkSnapshot
        ),
      });
"""
          if store_text.count(old_refresh_catch) != 1:
              raise SystemExit('root-store: refreshAll catch block not found')
          store.write_text(store_text.replace(old_refresh_catch, new_refresh_catch, 1), encoding='utf-8')

          # 5. Permanent startup contract tests.
          test_path = Path('mobile/src/navigation/startup-stability.test.ts')
          test_path.write_text("""const fs = require('fs');
const path = require('path');
const nodeProcess = require('process');

export {};

function section(source: string, start: string, end: string) {
  const from = source.indexOf(start);
  const to = source.indexOf(end, from + start.length);
  expect(from).toBeGreaterThanOrEqual(0);
  expect(to).toBeGreaterThan(from);
  return source.slice(from, to);
}

describe('Mobile startup stability contract', () => {
  const mobileRoot = nodeProcess.cwd();
  const client = fs.readFileSync(path.join(mobileRoot, 'src', 'api', 'client.ts'), 'utf8');
  const store = fs.readFileSync(path.join(mobileRoot, 'src', 'store', 'root-store.ts'), 'utf8');
  const app = fs.readFileSync(path.join(mobileRoot, 'App.tsx'), 'utf8');
  const gate = fs.readFileSync(
    path.join(mobileRoot, 'src', 'screens', 'mobile-account-gate-screen.tsx'),
    'utf8'
  );

  it('bounds cold-start session validation to one request policy', () => {
    const sessionRequest = section(client, 'export async function getSessionRequest', 'export async function refreshSessionRequest');
    expect(sessionRequest).toContain('COLD_START_SESSION_TIMEOUT_MS');
    expect(sessionRequest).toContain('_skipNetworkRetry: true');
  });

  it('never replays a rotating refresh token automatically', () => {
    const refreshRequest = section(client, 'export async function refreshSessionRequest', 'export async function forgotPasswordRequest');
    expect(refreshRequest).toContain('_skipAuthRefresh: true');
    expect(refreshRequest).toContain('_skipNetworkRetry: true');
    expect(refreshRequest).not.toContain('_allowRetry: true');
  });

  it('shows synchronization loading only while a request is active', () => {
    expect(gate).toContain("reason === 'sync_error' && isRefreshing && !error");
    expect(gate).not.toContain('useSyncWaitStage');
  });

  it('removes the unrelated location bypass from account bootstrap', () => {
    expect(app).toContain('bootTimedOut || bootstrapFailed');
    expect(app).not.toContain('continueWithoutLocation');
    expect(app).not.toContain('Continuar sin ubicacion');
  });

  it('preserves cached account authority and leaves optional data loading in background', () => {
    const initialize = section(store, 'initialize: async () =>', 'signIn: async');
    const signIn = section(store, 'signIn: async', 'signOut: async');
    expect(initialize).toContain('...stateFromCache(cached)');
    expect(initialize).not.toContain('refreshSessionRequest(rt');
    expect(signIn).toContain('void get().refreshAll();');
    expect(signIn).not.toContain('await get().refreshAll();');
  });
});
""", encoding='utf-8')

          # Add the contract to the existing explicit Jest gate without reformatting package.json.
          package = Path('mobile/package.json')
          package_text = package.read_text(encoding='utf-8')
          needle = 'src/native/call-action-headless-task.test.ts"'
          replacement = 'src/native/call-action-headless-task.test.ts src/navigation/startup-stability.test.ts"'
          if package_text.count(needle) != 1:
              raise SystemExit('mobile/package.json: test command tail not found')
          package.write_text(package_text.replace(needle, replacement, 1), encoding='utf-8')

          # RC evidence document. Physical APK validation remains explicitly pending.
          Path('RC-MOBILE-STARTUP-STABILITY-01.md').write_text("""# RC-MOBILE-STARTUP-STABILITY-01

## Base congelada

- Rama: `fix/mobile-startup-stability-20260806`
- Base: `main@1d30cb95391a8557bd21684d03d6c7f561cd71f4`
- Mobile observado: `1.2.0 (20)`

## Causa raíz confirmada

1. `/sync-error` mostraba `BrandSyncLoader` cuando `error` era nulo, aunque `refreshAll` no estuviera ejecutándose. Era una espera visual pasiva de hasta 80 segundos.
2. `/auth/me` en arranque tenía un timeout de 75 segundos, pero el interceptor podía repetir la solicitud dos veces. El tiempo de red podía superar ampliamente el timeout visual de la aplicación.
3. `/auth/refresh` rotaba credenciales y estaba marcado como reintentable. Una respuesta perdida podía provocar el replay de un token ya consumido.
4. El fallback offline de `initialize` conservaba `cached.user` pero descartaba `cached.authContext`, enviando una sesión conocida a `/sync-error`.
5. El botón `Continuar sin ubicación` alteraba flags de autenticación desde un problema que no era de GPS.
6. `signIn` esperaba todas las cargas operativas opcionales antes de devolver control a navegación.

## Corrección mínima

- El loader de sincronización solo aparece mientras `isRefreshing` es verdadero.
- El GET de sesión de arranque conserva su timeout existente, pero no se repite de forma oculta.
- El refresh token rotatorio no se reintenta automáticamente.
- El caché conserva usuario, `authContext` y datos operativos.
- Sin caché y sin servidor se muestra la recuperación existente; la sesión persistida no se destruye por una caída transitoria.
- Se eliminó el bypass de ubicación.
- Las cargas operativas se ejecutan en segundo plano después de establecer identidad y autoridad.

## Alcance no modificado

- GPS y servicio en segundo plano.
- Llamadas y WebRTC.
- Mapas y rutas.
- Pagos y planes.
- Contratos del backend.
- Diseño general.

## Gates

- `mobile npm run typecheck`
- `mobile npm run lint`
- `mobile npm test`
- `backend npm test`
- CI completa del PR
- APK release candidato
- Prueba física pendiente antes de merge

## Estado

- `STARTUP_ROOT_CAUSE_CONFIRMED`
- `NO_PASSIVE_SYNC_LOADER`
- `NO_REFRESH_TOKEN_REPLAY`
- `CACHED_AUTHORITY_PRESERVED`
- `OPTIONAL_DATA_NOT_BOOT_BLOCKING`
- `APK_PHYSICAL_PASS=PENDING`
- `MERGE=NO`
""", encoding='utf-8')
          PY

      - name: Install and verify Mobile
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: Install and verify Backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Commit verified RC and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git rm .github/workflows/rc-mobile-startup-apply.yml
          git add RC-MOBILE-STARTUP-STABILITY-01.md mobile
          git commit -m "fix(mobile): stabilize session startup state machine"
          git push origin HEAD:fix/mobile-startup-stability-20260806
