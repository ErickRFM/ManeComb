name: Mobile root-store refactor helper

on:
  push:
    branches:
      - refactor/mobile-root-store-modularization
    paths:
      - .github/workflows/mobile-root-store-refactor-helper.yml
      - mobile/scripts/refactor-root-store-foundation.mjs

permissions:
  contents: write

jobs:
  apply-foundation-delegation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/mobile-root-store-modularization
          fetch-depth: 0

      - name: Apply deterministic refactor
        run: node mobile/scripts/refactor-root-store-foundation.mjs

      - name: Commit refactor when changed
        shell: bash
        run: |
          if git diff --quiet -- mobile/src/store/root-store.ts; then
            echo "No root-store change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/store/root-store.ts
          git commit -m "refactor(mobile): delegate root store foundation"
          git push origin HEAD:refactor/mobile-root-store-modularization
