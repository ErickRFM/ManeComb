name: Apply mobile server banner auth fix

on:
  push:
    branches:
      - fix/mobile-server-banner-auth-20260805

permissions:
  contents: write

concurrency:
  group: mobile-server-banner-auth-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/mobile-server-banner-auth-20260805
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply deterministic patch
        run: node scripts/apply-mobile-server-banner-auth-fix.mjs

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Run focused lint
        working-directory: mobile
        run: npx eslint src/store/root-store.ts src/utils/realtime-state.ts src/utils/realtime-state.test.ts src/components/connection-banner.tsx

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mobile): recover socket auth before showing server outage"
          git push origin HEAD:fix/mobile-server-banner-auth-20260805
