name: Temporary fix and certify Admin Global P3

on:
  push:
    branches:
      - feat/adm-global-p3-operations
    paths:
      - .github/workflows/_temporary-fix-certify-adm-p3.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout P3 branch
        uses: actions/checkout@v5
        with:
          ref: feat/adm-global-p3-operations
          fetch-depth: 0

      - name: Enforce audit filter allowlist and permanent gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const servicePath = 'backend/src/modules/platform/operations-service.js';
          let service = fs.readFileSync(servicePath, 'utf8');
          const oldBlock = `  if (source.filters && typeof source.filters === "object") {
            safe.filters = Object.fromEntries(
              Object.entries(source.filters)
                .filter(([, value]) => ["string", "boolean", "number"].includes(typeof value) || value === null)
                .slice(0, 12)
                .map(([key, value]) => [sanitizeText(key, 40), typeof value === "string" ? sanitizeText(value, 120) : value])
            );
          }`;
          const newBlock = `  if (source.filters && typeof source.filters === "object") {
            const allowedFilterKeys = new Set([
              "search", "q", "planId", "paymentStatus", "activationStatus",
              "onboardingStatus", "organizationId", "action", "actorId",
              "severity", "since", "until", "page", "limit", "sort", "order"
            ]);
            safe.filters = Object.fromEntries(
              Object.entries(source.filters)
                .filter(([key, value]) => allowedFilterKeys.has(key) && (["string", "boolean", "number"].includes(typeof value) || value === null))
                .slice(0, 18)
                .map(([key, value]) => [key, typeof value === "string" ? sanitizeText(value, 120) : value])
            );
          }`;
          if (!service.includes(oldBlock)) throw new Error('No se encontró el bloque de filtros de auditoría esperado');
          service = service.replace(oldBlock, newBlock);
          fs.writeFileSync(servicePath, service);

          const backendPath = 'backend/package.json';
          const backend = JSON.parse(fs.readFileSync(backendPath, 'utf8'));
          if (!backend.scripts['test:platform'].includes('platform-operations.test.js')) {
            backend.scripts['test:platform'] += ' && node --require ./test/setup-env.js test/platform-operations.test.js';
          }
          fs.writeFileSync(backendPath, `${JSON.stringify(backend, null, 2)}\n`);

          const adminPath = 'admin-global/package.json';
          const admin = JSON.parse(fs.readFileSync(adminPath, 'utf8'));
          if (!admin.scripts.test.includes('p3-operations-contract.test.mjs')) {
            admin.scripts.test += ' && node test/p3-operations-contract.test.mjs';
          }
          fs.writeFileSync(adminPath, `${JSON.stringify(admin, null, 2)}\n`);

          const contractPath = 'scripts/validate-environment-contract.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          contract = contract.replace(
            "['platform-auth.test.js', 'platform-mfa.test.js', 'platform-api-base.test.js', 'platform-security-config.test.js', 'platform-companies.test.js']",
            "['platform-auth.test.js', 'platform-mfa.test.js', 'platform-api-base.test.js', 'platform-security-config.test.js', 'platform-companies.test.js', 'platform-operations.test.js']"
          );
          contract = contract.replace(
            "['p1-contract.test.mjs', 'p2-companies-contract.test.mjs']",
            "['p1-contract.test.mjs', 'p2-companies-contract.test.mjs', 'p3-operations-contract.test.mjs']"
          );
          fs.writeFileSync(contractPath, contract);
          NODE

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-global/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix admin-global

      - name: Verify Platform P3 backend
        run: |
          npm run test:platform --prefix backend
          node scripts/validate-environment-contract.mjs

      - name: Verify Admin Global P3
        env:
          VITE_API_URL: http://127.0.0.1:5000
        run: |
          npm run typecheck --prefix admin-global
          npm test --prefix admin-global
          npm run build --prefix admin-global
          test -f admin-global/dist/_redirects
          grep -Fxq '/* /index.html 200' admin-global/dist/_redirects

      - name: Close P3 and remove temporary workflows
        run: |
          cat > RC-ADM-GLOBAL-P3.md <<'EOF'
          # ADM-GLOBAL-P3 — Comercial, Sistema y Auditoría

          **Rama:** `feat/adm-global-p3-operations`  
          **Base apilada:** `feat/adm-global-p2-companies`  
          **Estado:** implementación técnica cerrada; pendiente de revisión y merge secuencial

          ## Alcance cerrado

          - Órdenes comerciales globales paginadas y filtradas en modo lectura.
          - Detalle comercial sanitizado sin referencias privadas del proveedor ni metadata cruda.
          - Readiness global sanitizado de infraestructura e integraciones.
          - Auditoría Platform paginada con metadata y filtros bajo allowlist explícita.
          - IP, user-agent, secretos y payloads arbitrarios quedan fuera de las respuestas.
          - Permisos separados para comercial, sistema y auditoría.
          - Pantallas responsive con carga, error, reintento, persistencia y paginación.
          - Pruebas backend, HTTP y frontend incorporadas a gates permanentes.

          ## Límites

          P3 no captura pagos, no reembolsa, no cancela suscripciones, no activa cuentas, no rota secretos y no elimina auditoría. Las acciones controladas permanecen en P4.

          No se modificaron secretos, MongoDB, Render, Cloudflare ni Producción.

          ## Certificación

          - Platform backend suites P0-P3: PASS
          - Commercial/System/Audit tests: PASS
          - Audit metadata/filter allowlists: PASS
          - Admin Global typecheck and P1-P3 tests: PASS
          - Admin Global build and SPA fallback: PASS
          - Environment contract: PASS
          EOF

          rm -f .github/workflows/_temporary-certify-adm-p3.yml
          rm -f .github/workflows/_temporary-fix-certify-adm-p3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(admin): close ADM-GLOBAL-P3"
          git push origin HEAD:feat/adm-global-p3-operations
