name: RTC multidevice socket contract patch

on:
  push:
    branches:
      - fix/rtc-multidevice-accept-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'rtc multidevice socket contract generated'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rtc-multidevice-accept-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Add enforced socket ownership assertion
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'backend/test/rtc-call-signaling.test.js';
          let source = fs.readFileSync(file, 'utf8');
          const marker = '  console.log("ok - rtc-call-signaling async authority contract");';
          if (!source.includes(marker)) throw new Error('rtc signaling marker not found');
          const block = `  // A second live socket for the same logical user must never evict the winner from the RTC room.\n  {\n    const socketSource = require("node:fs").readFileSync(\n      require("node:path").join(__dirname, "../src/sockets/index.js"),\n      "utf8"\n    );\n    const joinStart = socketSource.indexOf('socket.on("rtc:join"');\n    const joinEnd = socketSource.indexOf('// C.1: leave/offer/answer/ICE/stats', joinStart);\n    assert.ok(joinStart >= 0 && joinEnd > joinStart, "rtc:join contract must remain discoverable");\n    const joinBlock = socketSource.slice(joinStart, joinEnd);\n    assert.ok(joinBlock.includes('reason: "already_connected_elsewhere"'));\n    assert.equal(joinBlock.includes('socketsLeave'), false, "a live sibling socket must not evict the active device");\n  }\n\n`;
          source = source.replace(marker, block + marker);
          fs.writeFileSync(file, source);
          NODE
          node --check backend/test/rtc-call-signaling.test.js
      - name: Commit assertion
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git add backend/test/rtc-call-signaling.test.js
          git commit -m "rtc multidevice socket contract generated"
          git push origin HEAD:fix/rtc-multidevice-accept-ownership
