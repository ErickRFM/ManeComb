name: Portal communication lockfile sync

on:
  push:
    branches:
      - feat/portal-communication-20260812
    paths:
      - .github/workflows/portal-comms-lockfile.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/portal-communication-20260812
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate package lock only
        working-directory: ventas
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- ventas/package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ventas/package-lock.json
          git commit -m "build(comms): sync ventas lockfile"
          git push origin HEAD:feat/portal-communication-20260812
