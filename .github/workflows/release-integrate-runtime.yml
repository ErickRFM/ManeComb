name: Integrate operational runtime

on:
  push:
    branches:
      - release/consolidation-20260805
    paths:
      - .github/workflows/release-integrate-runtime.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidation-20260805
          fetch-depth: 0

      - name: Merge operational GPS and global Radio runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git merge-base --is-ancestor origin/rc-operational-runtime-01 HEAD; then
            echo 'Operational runtime is already integrated.'
            exit 0
          fi

          if ! git merge --no-ff --no-edit origin/rc-operational-runtime-01; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]}"

            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != 'mobile/package.json' ]; then
              echo '::error::Unexpected operational runtime conflicts.'
              git status --short
              exit 1
            fi

            # Main/consolidation owns the complete current suite. Add only the
            # two focused Radio runtime tests contributed by this RC.
            git checkout --ours mobile/package.json
            node <<'NODE'
          const fs = require('fs');
          const path = 'mobile/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = [
            'src/features/radio-live/radio-live-store.test.ts',
            'src/screens/radio/services/radio-realtime-service.test.ts',
          ];
          for (const testPath of additions) {
            if (!pkg.scripts.test.includes(testPath)) {
              pkg.scripts.test = `${pkg.scripts.test} ${testPath}`;
            }
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
            git add mobile/package.json
            git commit --no-edit
          fi

          git push origin HEAD:release/consolidation-20260805
