name: Agent RTC reconnect lifecycle codemod

on:
  push:
    branches:
      - agent/rtc-reconnect-lifecycle-20260809
    paths:
      - .github/workflows/agent-rtc-reconnect-lifecycle-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rtc-reconnect-lifecycle-20260809
          fetch-depth: 0

      - name: Apply exact reconnect lifecycle edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing expected snippet: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected one occurrence but found multiple: ${label}`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          const servicePath = 'backend/src/services/rtc-call-service.js';
          let service = fs.readFileSync(servicePath, 'utf8');
          const before = `  async function handleDisconnect(socketId, { isUserConnected } = {}) {\n    for (const call of Array.from(callsById.values())) {\n      const isCaller = call.callerSocketId === socketId;\n      const calleeEntry = Array.from(call.calleeSockets.entries()).find(([, sid]) => sid === socketId);\n      if (!isCaller && !calleeEntry) continue;\n\n      const goneUserId = isCaller ? call.callerId : calleeEntry[0];\n      if (isCaller) call.callerSocketId = null;\n      else call.calleeSockets.delete(goneUserId);\n\n      const stillConnected = isUserConnected ? await isUserConnected(goneUserId) : false;\n      if (stillConnected) continue;\n\n      scheduleDisconnectCleanup(call, goneUserId);\n    }\n  }`;
          const after = `  function collectDisconnectCandidates(call, socketId) {\n    const candidates = new Set();\n    const isCaller = call.callerSocketId === socketId;\n    const calleeEntry = Array.from(call.calleeSockets.entries()).find(([, sid]) => sid === socketId);\n\n    if (isCaller) {\n      call.callerSocketId = null;\n      candidates.add(call.callerId);\n    }\n    if (calleeEntry) {\n      call.calleeSockets.delete(calleeEntry[0]);\n      candidates.add(calleeEntry[0]);\n    }\n\n    // After reconnect, presence/RTC may use a different socket. During active calls,\n    // reconcile participants whose original RTC binding disappeared against live presence.\n    // Ringing is intentionally excluded so an unaccepted callee is not treated as disconnected.\n    if (call.status === "active") {\n      if (!call.callerSocketId) candidates.add(call.callerId);\n      for (const calleeId of call.calleeIds) {\n        if (!call.calleeSockets.has(calleeId)) candidates.add(calleeId);\n      }\n    }\n\n    return candidates;\n  }\n\n  async function handleDisconnect(socketId, { isUserConnected } = {}) {\n    for (const call of Array.from(callsById.values())) {\n      const candidates = collectDisconnectCandidates(call, socketId);\n      if (!candidates.size) continue;\n\n      for (const goneUserId of candidates) {\n        const stillConnected = isUserConnected ? await isUserConnected(goneUserId) : false;\n        if (stillConnected) continue;\n        scheduleDisconnectCleanup(call, goneUserId);\n      }\n    }\n  }`;
          service = replaceOnce(service, before, after, 'RTC disconnect reconciliation');
          fs.writeFileSync(servicePath, service);

          const packagePath = 'backend/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const command = 'node --require ./test/setup-env.js test/rtc-call-reconnect-lifecycle.test.js';
          if (!pkg.scripts.test.includes(command)) {
            const anchor = 'node --require ./test/setup-env.js test/rtc-call-signaling.test.js';
            if (!pkg.scripts.test.includes(anchor)) throw new Error('Missing RTC signaling test anchor');
            pkg.scripts.test = pkg.scripts.test.replace(anchor, `${anchor} && ${command}`);
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run RTC reconnect regression
        working-directory: backend
        run: node --require ./test/setup-env.js test/rtc-call-reconnect-lifecycle.test.js

      - name: Commit codemod
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/rtc-call-service.js backend/package.json
          git commit -m "fix(rtc): reconcile repeated reconnect disconnect lifecycle"
          git push origin HEAD:agent/rtc-reconnect-lifecycle-20260809
