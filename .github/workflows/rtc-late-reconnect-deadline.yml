name: RTC late reconnect deadline patch

on:
  push:
    branches:
      - fix/rtc-socket-lifecycle-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'rtc late reconnect deadline generated'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rtc-socket-lifecycle-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply late reconnect deadline guard
        run: node scripts/patch-rtc-late-reconnect-deadline.js
      - name: Validate JavaScript
        run: |
          node --check backend/src/services/rtc-call-service.js
          node --check backend/test/rtc-call-reconnect-lifecycle.test.js
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run RTC focused regressions
        working-directory: backend
        run: |
          node --require ./test/setup-env.js test/rtc-call-signaling.test.js
          node --require ./test/setup-env.js test/rtc-call-reconnect-lifecycle.test.js
          node --require ./test/setup-env.js test/rtc-distributed-authority.test.js
      - name: Commit generated guard
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git add backend/src/services/rtc-call-service.js backend/test/rtc-call-reconnect-lifecycle.test.js
          git commit -m "rtc late reconnect deadline generated"
          git push origin HEAD:fix/rtc-socket-lifecycle-ownership
