name: TEMP directory impact race fix

on:
  push:
    branches:
      - fix/directory-action-loading-sales-parity-20260810
    paths:
      - scripts/temp-fix-directory-impact-race.mjs
      - .github/workflows/temp-directory-impact-race.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Apply deterministic race fix
        run: node scripts/temp-fix-directory-impact-race.mjs
      - name: Focused regression
        working-directory: mobile
        run: npx jest --runInBand src/screens/users/directory-action-state.test.ts src/screens/users/directory-impact-race.test.ts
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Diff check
        run: git diff --check
      - name: Commit generated fix
        run: |
          git config user.name "ErickRFM"
          git config user.email "55464579+ErickRFM@users.noreply.github.com"
          git add mobile/src/screens/users-screen.tsx mobile/src/screens/users/directory-impact-race.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(mobile): bind directory impact responses to active target"
          git push origin HEAD:${{ github.ref_name }}
