name: Communication branch autofix

on:
  push:
    branches:
      - agent/communication-closure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/communication-closure
          fetch-depth: 0
      - name: Apply deterministic RTC type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('mobile/src/features/calls/call-runtime.ts')
          text = runtime.read_text()
          old = "nextPeer.ontrack = (event: { streams?: any[] }) => {"
          new = "nextPeer.ontrack = (event: { streams?: readonly any[] }) => {"
          if old not in text:
              raise SystemExit('call-runtime ontrack pattern not found')
          runtime.write_text(text.replace(old, new, 1))

          modal = Path('mobile/src/features/calls/components/incoming-call-modal.tsx')
          text = modal.read_text()
          old = "    return () => stopCallForegroundService();"
          new = "    return () => {\n      void stopCallForegroundService();\n    };"
          if old not in text:
              raise SystemExit('foreground cleanup pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "nativeVideo: { position: 'absolute', inset: 0, width: '100%', height: '100%' },",
              "nativeVideo: { position: 'absolute', top: 0, right: 0, bottom: 0, left: 0, width: '100%', height: '100%' },",
              1,
          )
          modal.write_text(text)

          tests = Path('mobile/src/features/calls/call-store.test.ts')
          text = tests.read_text()
          text = text.replace(
              "expect(capturedRuntime!.mic.at(-1)).toBe(false);",
              "expect(capturedRuntime!.mic[capturedRuntime!.mic.length - 1]).toBe(false);",
              1,
          )
          text = text.replace(
              "expect(capturedRuntime!.camera.at(-1)).toBe(false);",
              "expect(capturedRuntime!.camera[capturedRuntime!.camera.length - 1]).toBe(false);",
              1,
          )
          tests.write_text(text)
          PY
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/communication-autofix.yml
          git add mobile/src/features/calls
          git commit -m "fix(calls): satisfy RTC type contracts"
          git push origin HEAD:agent/communication-closure
