name: Close desktop sales carousel

on:
  push:
    branches:
      - fix/ventas-desktop-carousel-20260805

permissions:
  contents: write

jobs:
  close-phase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ventas-desktop-carousel-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Apply desktop carousel fix
        run: python scripts/close-ventas-desktop-carousel.py
      - name: Install Ventas
        working-directory: ventas
        run: npm ci
      - name: Typecheck Ventas
        working-directory: ventas
        run: npm run typecheck
      - name: Build and verify responsive layout
        working-directory: ventas
        run: npm run build
      - name: Validate clean desktop contract
        shell: bash
        run: |
          grep -q "desktopVisibleCards = width >= 1320 ? 4 : 3" ventas/screens/sales-screen.tsx
          grep -q "planCarouselViewportDesktop" ventas/screens/sales/styles.ts
          grep -q "planCarouselDesktop" ventas/screens/sales/styles.ts
          test -f ventas/dist/index.html
          test -f ventas/dist/_redirects
          git diff --check
      - name: Commit closed phase
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/close-ventas-desktop-carousel.yml scripts/close-ventas-desktop-carousel.py
          git add ventas/screens/sales-screen.tsx ventas/screens/sales/styles.ts ventas/scripts/verify-mobile-sales-layout.cjs
          git commit -m "fix(ventas): show complete plan cards on desktop"
          git push origin HEAD:fix/ventas-desktop-carousel-20260805
