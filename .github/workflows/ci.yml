name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      MERCADO_PAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
      MONGO_SERVER_SELECTION_TIMEOUT_MS: "1000"
      MONGODB_URI: ""
      MONGO_URI: ""
      NODE_ENV: test
      PAYMENT_PROVIDER: manual
      REQUIRE_MONGO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Install communication service dependencies
        working-directory: communication-service
        run: npm ci

      - name: Install backend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  mobile-quality:
    name: Mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  ventas-build:
    name: Ventas build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ventas
    env:
      VITE_API_URL: https://manecomb.onrender.com/api
      VITE_SOCKET_URL: https://manecomb.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build production web image
        run: docker build --build-arg VITE_API_URL=/api --build-arg VITE_SOCKET_URL=/ -f ../mobile/Dockerfile.web ..
