name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
      - "codex/**"
      - "audit/**"
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-admin-platform-model-hotfix:
    name: Apply Admin platform model hotfix
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/admin-global-platform-user-model-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: fix/admin-global-platform-user-model-20260806
          fetch-depth: 0

      - name: Import PlatformUserModel and add regression guard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const mongoStorePath = path.resolve('backend/src/data/mongo-store.js');
          let mongoStore = fs.readFileSync(mongoStorePath, 'utf8');
          const importNeedle = '  NotificationModel,\n  RtcSessionModel,';
          const importReplacement = '  NotificationModel,\n  PlatformUserModel,\n  RtcSessionModel,';

          if (!mongoStore.includes('  PlatformUserModel,')) {
            if (!mongoStore.includes(importNeedle)) {
              throw new Error('No se encontró el bloque esperado de modelos en mongo-store.js');
            }
            mongoStore = mongoStore.replace(importNeedle, importReplacement);
            fs.writeFileSync(mongoStorePath, mongoStore);
          }

          const testPath = path.resolve('backend/test/platform-mongo-store-model-import.test.js');
          fs.writeFileSync(testPath, `const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const source = fs.readFileSync(
            path.resolve(__dirname, "../src/data/mongo-store.js"),
            "utf8"
          );
          const modelsImport = source.match(
            /const\\s*\\{([\\s\\S]*?)\\}\\s*=\\s*require\\("\\.\\/models"\\);/
          );

          assert.ok(modelsImport, "mongo-store debe importar sus modelos desde ./models");
          assert.match(
            modelsImport[1],
            /\\bPlatformUserModel\\b/,
            "mongo-store debe importar PlatformUserModel antes de usarlo"
          );

          console.log("platform mongo model import: PASS");
          `);

          const packagePath = path.resolve('backend/package.json');
          let packageSource = fs.readFileSync(packagePath, 'utf8');
          const testNeedle = '"test:platform": "node --require ./test/setup-env.js test/platform-auth.test.js';
          const testReplacement = '"test:platform": "node --require ./test/setup-env.js test/platform-mongo-store-model-import.test.js && node --require ./test/setup-env.js test/platform-auth.test.js';
          if (!packageSource.includes('test/platform-mongo-store-model-import.test.js')) {
            if (!packageSource.includes(testNeedle)) {
              throw new Error('No se encontró el inicio esperado de test:platform');
            }
            packageSource = packageSource.replace(testNeedle, testReplacement);
            fs.writeFileSync(packagePath, packageSource);
          }
          NODE

      - name: Commit branch hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/data/mongo-store.js backend/test/platform-mongo-store-model-import.test.js backend/package.json
          if git diff --cached --quiet; then
            echo "Hotfix already applied"
            exit 0
          fi
          git commit -m "fix(admin): import platform user model in mongo store"
          git push origin HEAD:fix/admin-global-platform-user-model-20260806

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      MERCADO_PAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
      MONGO_SERVER_SELECTION_TIMEOUT_MS: "1000"
      MONGODB_URI: ""
      MONGO_URI: ""
      NODE_ENV: test
      PAYMENT_PROVIDER: manual
      REQUIRE_MONGO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Install backend and communication dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  communication-service-tests:
    name: Communication service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: communication-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: communication-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run standalone tests
        run: npm test

  mobile-quality:
    name: Mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate app version
        run: npm run version:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  android-debug-apk:
    name: Android debug APK
    needs: mobile-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manecomb-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ventas-build:
    name: Ventas build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ventas
    env:
      VITE_API_URL: https://api.example.invalid/api
      VITE_SOCKET_URL: https://api.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify Cloudflare SPA fallback
        run: test -f dist/_redirects && grep -Fxq '/* /index.html 200' dist/_redirects

  admin-global-build:
    name: Admin Global build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-global
    env:
      VITE_API_URL: https://api.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-global/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Workers SPA fallback
        run: |
          test ! -f dist/_redirects
          node -e "const fs=require('node:fs'); const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(config.name!=='manecomb-admin'||config.assets?.directory!=='./dist'||config.assets?.not_found_handling!=='single-page-application') process.exit(1)"

      - name: Dry-run Workers deployment
        run: npx --yes wrangler@4.119.0 deploy --dry-run

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate system authority map
        run: node scripts/validate-system-authorities.mjs

      - name: Validate environment contract
        run: node scripts/validate-environment-contract.mjs

      - name: Create non-secret validation environment
        run: cp backend/.env.example backend/.env

      - name: Validate development Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend image with Communication Service
        run: docker build --file backend/Dockerfile --tag manecomb-backend:ci .

      - name: Smoke backend and web containers
        run: bash scripts/smoke-containers.sh
