name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
      - "codex/**"
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      MERCADO_PAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
      MONGO_SERVER_SELECTION_TIMEOUT_MS: "1000"
      MONGODB_URI: ""
      MONGO_URI: ""
      NODE_ENV: test
      PAYMENT_PROVIDER: manual
      REQUIRE_MONGO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Install backend and communication dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  communication-service-tests:
    name: Communication service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: communication-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: communication-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run standalone tests
        run: npm test

  mobile-quality:
    name: Mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  android-debug-apk:
    name: Android debug APK
    needs: mobile-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manecomb-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ventas-build:
    name: Ventas build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ventas
    env:
      VITE_API_URL: https://api.example.invalid/api
      VITE_SOCKET_URL: https://api.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  admin-global-build:
    name: Admin Global build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-global
    env:
      VITE_API_URL: https://api.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-global/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create non-secret validation environment
        run: cp backend/.env.example backend/.env

      - name: Validate development Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend image with Communication Service
        run: docker build --file backend/Dockerfile --tag manecomb-backend:ci .
