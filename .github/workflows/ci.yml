name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
      - "codex/**"
      - "audit/**"
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      MERCADO_PAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
      MONGO_SERVER_SELECTION_TIMEOUT_MS: "1000"
      MONGODB_URI: ""
      MONGO_URI: ""
      NODE_ENV: test
      PAYMENT_PROVIDER: manual
      REQUIRE_MONGO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            communication-service/package-lock.json

      - name: Install backend and communication dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  communication-service-tests:
    name: Communication service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: communication-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: communication-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run standalone tests
        run: npm test

  mobile-quality:
    name: Mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate app version
        run: npm run version:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

  mobile-windows-tests:
    name: Mobile Jest (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest portability gate
        run: npm test

  android-debug-apk:
    # A compile gate only proves sources compile. This job certifies the produced
    # artifact is standalone and contains the required runtime Mapbox configuration.
    name: Android debug APK certification
    needs: mobile-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      ENVFILE: .env.ci
      MANECOMB_CERTIFY_ANDROID_DEBUG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Align Gradle cache home
        shell: bash
        run: echo "GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Test Mapbox configuration gate
        run: node scripts/test-android-mapbox-ci-gate.js

      - name: Prepare Mapbox CI configuration
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: node scripts/android-mapbox-artifact-gate.js prepare .env.ci

      - name: Build standalone debug APK
        run: |
          chmod +x android/gradlew
          node scripts/build-android-debug-bundled.js

      - name: Certify standalone APK
        run: node scripts/android-mapbox-artifact-gate.js certify android/app/build/outputs/apk/debug/app-debug.apk .env.ci

      - name: Remove temporary CI configuration
        if: always()
        run: rm -f .env.ci

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: manecomb-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ventas-build:
    name: Ventas build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ventas
    env:
      VITE_API_URL: https://api.example.invalid/api
      VITE_SOCKET_URL: https://api.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify Cloudflare SPA fallback
        run: test -f dist/_redirects && grep -Fxq '/* /index.html 200' dist/_redirects

  admin-global-build:
    name: Admin Global build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-global
    env:
      VITE_API_URL: https://api.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-global/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Workers SPA fallback
        run: |
          test ! -f dist/_redirects
          node -e "const fs=require('node:fs'); const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(config.name!=='manecomb-admin'||config.assets?.directory!=='./dist'||config.assets?.not_found_handling!=='single-page-application') process.exit(1)"

      - name: Dry-run Workers deployment
        run: npx --yes wrangler@4.119.0 deploy --dry-run

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate system authority map
        run: node scripts/validate-system-authorities.mjs

      - name: Validate environment contract
        run: node scripts/validate-environment-contract.mjs

      - name: Create non-secret validation environment
        run: cp backend/.env.example backend/.env

      - name: Validate development Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend image with Communication Service
        run: docker build --file backend/Dockerfile --tag manecomb-backend:ci .

      - name: Smoke backend and web containers
        run: bash scripts/smoke-containers.sh
