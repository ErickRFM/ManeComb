name: Close paginated chat history

on:
  push:
    branches:
      - agent/communication-closure

permissions:
  contents: write

jobs:
  close-phase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/communication-closure
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Apply pagination patch
        shell: bash
        run: |
          python scripts/close-chat-pagination.py
          python - <<'PY'
          from pathlib import Path

          controller = Path('mobile/src/screens/chat/hooks/use-chat-controller.ts')
          text = controller.read_text()
          text = text.replace(
              '    handleChatMessagesScroll,\n    isNearMessagesBottomRef,',
              '    handleMessagesScroll,\n    isNearMessagesBottomRef,',
              1,
          )
          marker = '    handleMessagesScroll,\n    handleOpenDirect,'
          if marker not in text:
              raise SystemExit('controller return scroll marker missing')
          text = text.replace(marker, '    handleChatMessagesScroll,\n    handleOpenDirect,', 1)
          controller.write_text(text)

          test_file = Path('mobile/src/utils/chat-pagination.test.ts')
          test = test_file.read_text()
          test = test.replace(
              "import { readFileSync } from 'fs';\nimport { resolve } from 'path';",
              "declare const require: (id: string) => any;\ndeclare const __dirname: string;\nconst { readFileSync } = require('fs');\nconst { resolve } = require('path');",
              1,
          )
          test_file.write_text(test)
          PY
      - name: Install mobile
        working-directory: mobile
        run: npm ci
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck
      - name: Test mobile
        working-directory: mobile
        run: npm test -- --runInBand
      - name: Commit closed phase
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/communication-chat-pagination.yml scripts/close-chat-pagination.py
          git add mobile/src
          git commit -m "perf(chat): paginate long conversation history"
          git push origin HEAD:agent/communication-closure
