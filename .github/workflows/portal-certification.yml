name: Portal production certification

on:
  pull_request:
    paths:
      - ".github/workflows/portal-certification.yml"
      - "backend/src/app.js"
      - "backend/src/services/account-channel.js"
      - "backend/src/services/auth-context.js"
      - "backend/src/services/enterprise-capabilities.js"
      - "backend/src/services/runtime-readiness.js"
      - "backend/test/public-payment-health.test.js"
      - "mobile/e2e/certification/**"
      - "mobile/playwright.certification.config.ts"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "scripts/verify-production-certification-target.mjs"
      - "ventas/**"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL desplegada de Ventas/Portal a certificar"
        required: true
        default: "https://manecomb.com"
        type: string
      api_url:
        description: "Base URL desplegada del API (incluye /api)"
        required: true
        default: "https://manecomb.onrender.com/api"
        type: string
      expected_commit:
        description: "SHA exacto esperado; vacío usa el SHA del workflow"
        required: false
        default: ""
        type: string
      required_capabilities:
        description: "Capacidades que no pueden estar degradadas (CSV)"
        required: true
        default: "storage,payments"
        type: string
      run_authenticated:
        description: "Ejecutar matriz autenticada de roles"
        required: true
        default: false
        type: boolean
      allow_mutations:
        description: "Permitir cambio/rollback de contraseña y revocación de sesiones"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: portal-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-responsive:
    name: Public portal and local authenticated matrices
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    env:
      CERT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || '' }}
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            ventas/package-lock.json

      - name: Verify production target policy contract
        run: node ../scripts/verify-production-certification-target.mjs --self-test

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Ventas dependencies
        run: npm ci --prefix ../ventas

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive public and local authenticated certification
        run: >-
          npx playwright test
          --config playwright.certification.config.ts
          e2e/certification/public-responsive.spec.ts
          e2e/certification/local-account-channel.spec.ts
          e2e/certification/local-role-access.spec.ts
          e2e/certification/backend-portal-capability-contract.spec.ts

      - name: Upload public and local contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-public-certification-${{ github.run_id }}
          path: |
            mobile/playwright-certification-report
            mobile/playwright-certification-results.json
            mobile/test-results/portal-certification
          if-no-files-found: warn
          retention-days: 14

  production-preflight:
    name: Production deployment identity and readiness
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CERT_BASE_URL: ${{ inputs.base_url }}
      CERT_API_URL: ${{ inputs.api_url }}
      CERT_EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
      CERT_REQUIRED_CAPABILITIES: ${{ inputs.required_capabilities }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify canonical targets, deployed SHA and core readiness
        run: node scripts/verify-production-certification-target.mjs

  authenticated-matrix:
    name: Authenticated roles and security
    if: github.event_name == 'workflow_dispatch' && inputs.run_authenticated == true
    needs: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    env:
      CERT_BASE_URL: ${{ inputs.base_url }}
      CERT_ALLOW_MUTATIONS: ${{ inputs.allow_mutations == true && '1' || '0' }}
      CERT_OWNER_EMAIL: ${{ secrets.CERT_OWNER_EMAIL }}
      CERT_OWNER_PASSWORD: ${{ secrets.CERT_OWNER_PASSWORD }}
      CERT_OWNER_NEXT_PASSWORD: ${{ secrets.CERT_OWNER_NEXT_PASSWORD }}
      CERT_ADMIN_EMAIL: ${{ secrets.CERT_ADMIN_EMAIL }}
      CERT_ADMIN_PASSWORD: ${{ secrets.CERT_ADMIN_PASSWORD }}
      CERT_BILLING_EMAIL: ${{ secrets.CERT_BILLING_EMAIL }}
      CERT_BILLING_PASSWORD: ${{ secrets.CERT_BILLING_PASSWORD }}
      CERT_SUPERVISOR_EMAIL: ${{ secrets.CERT_SUPERVISOR_EMAIL }}
      CERT_SUPERVISOR_PASSWORD: ${{ secrets.CERT_SUPERVISOR_PASSWORD }}
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify certification secret presence
        shell: bash
        run: |
          missing=0
          for name in CERT_OWNER_EMAIL CERT_OWNER_PASSWORD CERT_ADMIN_EMAIL CERT_ADMIN_PASSWORD CERT_BILLING_EMAIL CERT_BILLING_PASSWORD CERT_SUPERVISOR_EMAIL CERT_SUPERVISOR_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name no está configurado como GitHub Actions secret"
              missing=1
            fi
          done
          if [ "${CERT_ALLOW_MUTATIONS}" = "1" ] && [ -z "${CERT_OWNER_NEXT_PASSWORD}" ]; then
            echo "::error::CERT_OWNER_NEXT_PASSWORD es obligatorio cuando allow_mutations=true"
            missing=1
          fi
          exit "$missing"

      - name: Run live role access matrix
        run: npx playwright test --config playwright.certification.config.ts --project desktop-1280 e2e/certification/role-access.spec.ts

      - name: Run account security mutation matrix
        if: inputs.allow_mutations == true
        run: npx playwright test --config playwright.certification.config.ts --project desktop-1280 e2e/certification/account-security.spec.ts

      - name: Upload authenticated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-authenticated-certification-${{ github.run_id }}
          path: |
            mobile/playwright-certification-report
            mobile/playwright-certification-results.json
            mobile/test-results/portal-certification
          if-no-files-found: warn
          retention-days: 14
