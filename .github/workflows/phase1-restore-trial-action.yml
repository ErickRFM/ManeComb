name: Phase 1 restore trial action

on:
  push:
    branches:
      - fix/auth-account-channel-authority

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/auth-account-channel-authority

      - name: Apply guarded replacement
        run: node scripts/phase1-restore-trial-action.cjs

      - name: Validate Ventas contracts
        run: |
          npm ci --prefix ventas
          npm run verify:contracts --prefix ventas
          npm run typecheck --prefix ventas

      - name: Commit validated trial action
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ventas/screens/sales-screen.tsx
          git diff --cached --check
          git commit -m "fix(ventas): connect trial CTA to checkout intent"
          git push origin HEAD:fix/auth-account-channel-authority
