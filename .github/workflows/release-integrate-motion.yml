name: Integrate mobile motion audit

on:
  push:
    branches:
      - release/consolidation-20260805
    paths:
      - .github/workflows/release-integrate-motion.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidation-20260805
          fetch-depth: 0

      - name: Merge mobile motion audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git merge-base --is-ancestor origin/agent/mobile-motion-audit HEAD; then
            echo 'Mobile motion audit is already integrated.'
            exit 0
          fi

          if ! git merge --no-ff --no-edit origin/agent/mobile-motion-audit; then
            echo '::error::Mobile motion integration has conflicts.'
            git status --short
            echo 'Conflicted files:'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git push origin HEAD:release/consolidation-20260805
