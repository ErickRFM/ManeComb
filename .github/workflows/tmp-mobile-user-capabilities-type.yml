name: Temporary Mobile User Capability Type Codemod

on:
  push:
    branches:
      - agent/mobile-capability-authority-20260808
    paths:
      - .github/workflows/tmp-mobile-user-capabilities-type.yml

permissions:
  contents: write

jobs:
  patch-user-capability-type:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/mobile-capability-authority-20260808
          fetch-depth: 0

      - name: Apply exact codemod
        run: node .github/scripts/patch-mobile-user-capabilities-type.mjs

      - name: Verify patch scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          expected=$'mobile/src/screens/alerts/AlertsScreen.tsx\nmobile/src/types/app.ts'
          test "$changed" = "$expected"
          git diff -- $changed

      - name: Commit type contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/screens/alerts/AlertsScreen.tsx mobile/src/types/app.ts
          git commit -m "refactor(mobile): type enterprise capabilities on User"
          git push origin HEAD:agent/mobile-capability-authority-20260808
