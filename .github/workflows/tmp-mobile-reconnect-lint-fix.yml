name: Temporary reconnect lint fix

on:
  push:
    branches:
      - fix/mobile-reconnect-ui-stability

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[generated reconnect lint]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply exact lint fix
        run: node scripts/tmp-mobile-reconnect-lint-fix.js

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run lint
        working-directory: mobile
        run: npm run lint

      - name: Run focused reconnect regression
        working-directory: mobile
        run: npx jest src/store/reconnect-ui-stability.test.ts --runInBand

      - name: Validate diff
        run: git diff --check

      - name: Commit fix and remove temporary tooling
        shell: bash
        run: |
          rm scripts/tmp-mobile-reconnect-lint-fix.js
          rm .github/workflows/tmp-mobile-reconnect-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/screens/checklist-screen.tsx scripts/tmp-mobile-reconnect-lint-fix.js .github/workflows/tmp-mobile-reconnect-lint-fix.yml
          git commit -m "fix(mobile): satisfy checklist reconnect hooks lint [generated reconnect lint]"
          git push origin HEAD:${{ github.ref_name }}
