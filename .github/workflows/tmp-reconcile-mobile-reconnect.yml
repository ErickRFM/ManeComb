name: Temporary reconnect reconciliation

on:
  push:
    branches:
      - fix/mobile-reconnect-ui-stability

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[generated reconnect reconciliation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply exact latest-main reconciliation
        run: node scripts/tmp-reconcile-mobile-reconnect.js

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run typecheck and lint
        working-directory: mobile
        run: |
          npm run typecheck
          npm run lint

      - name: Run focused regressions
        working-directory: mobile
        run: npx jest src/store/reconnect-ui-stability.test.ts src/screens/checklist-screen.test.ts src/utils/realtime-state.test.ts --runInBand

      - name: Validate diff
        run: git diff --check

      - name: Commit reconciled fix and remove temporary tooling
        shell: bash
        run: |
          rm scripts/tmp-reconcile-mobile-reconnect.js
          rm .github/workflows/tmp-reconcile-mobile-reconnect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/store/root-store.ts mobile/src/screens/checklist-screen.tsx scripts/tmp-reconcile-mobile-reconnect.js .github/workflows/tmp-reconcile-mobile-reconnect.yml
          git commit -m "fix(mobile): reconcile reconnect stability with current main [generated reconnect reconciliation]"
          git push origin HEAD:${{ github.ref_name }}
