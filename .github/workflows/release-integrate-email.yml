name: Integrate email recovery audit

on:
  push:
    branches:
      - release/consolidation-20260805
    paths:
      - .github/workflows/release-integrate-email.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidation-20260805
          fetch-depth: 0

      - name: Merge email recovery audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git merge-base --is-ancestor origin/agent/email-production-ux-audit HEAD; then
            echo 'Email audit is already integrated.'
            exit 0
          fi

          if ! git merge --no-ff --no-edit origin/agent/email-production-ux-audit; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]}"

            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != 'backend/package.json' ]; then
              echo '::error::Unexpected email integration conflicts.'
              git status --short
              exit 1
            fi

            # Keep the current complete backend suite and extend the focused
            # password recovery command with the copy contract from the email audit.
            git checkout --ours backend/package.json
            node <<'NODE'
          const fs = require('fs');
          const path = 'backend/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const copyTest = 'node --require ./test/setup-env.js test/password-recovery-copy.test.js';
          if (!pkg.scripts['test:password-recovery'].includes('password-recovery-copy.test.js')) {
            pkg.scripts['test:password-recovery'] = `${pkg.scripts['test:password-recovery']} && ${copyTest}`;
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
            git add backend/package.json
            git commit --no-edit
          fi

          git push origin HEAD:release/consolidation-20260805
