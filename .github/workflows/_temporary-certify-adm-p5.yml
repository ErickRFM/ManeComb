name: Temporary certify Admin Global P5

on:
  push:
    branches:
      - feat/adm-global-p5-private-access
    paths:
      - .github/workflows/_temporary-certify-adm-p5.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout P5 branch
        uses: actions/checkout@v5
        with:
          ref: feat/adm-global-p5-private-access
          fetch-depth: 0

      - name: Connect private access and permanent gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value); }
          function replaceRequired(path, pattern, replacement, label) {
            let content = read(path);
            if (typeof pattern === 'string') {
              if (!content.includes(pattern)) throw new Error(`${path}: no se encontró ${label}`);
              content = content.replace(pattern, replacement);
            } else {
              if (!pattern.test(content)) throw new Error(`${path}: no se encontró ${label}`);
              content = content.replace(pattern, replacement);
            }
            write(path, content);
          }

          const appPath = 'backend/src/app.js';
          let app = read(appPath);
          if (!app.includes('require("./middlewares/platform-access")')) {
            app = app.replace(
              /const platformRouter = require\(["']\.\/modules\/platform["']\);/,
              (match) => `${match}\nconst { platformAccess } = require("./middlewares/platform-access");`
            );
          }
          app = app.replace(
            /app\.use\(["']\/api\/platform["'],\s*platformRouter\);/,
            'app.use("/api/platform", platformAccess, platformRouter);'
          );
          if (!app.includes('app.use("/api/platform", platformAccess, platformRouter);')) {
            throw new Error('No se pudo montar platformAccess antes de platformRouter');
          }
          write(appPath, app);

          const serverPath = 'backend/src/server.js';
          let server = read(serverPath);
          if (!server.includes('require("./config/platform-access")')) {
            server = server.replace(
              'const { assertPlatformSecurityConfiguration } = require("./config/platform-security");',
              'const { assertPlatformSecurityConfiguration } = require("./config/platform-security");\nconst { assertPlatformAccessConfiguration } = require("./config/platform-access");'
            );
          }
          if (!server.includes('const platformAccessSecurity = assertPlatformAccessConfiguration();')) {
            server = server.replace(
              'const platformSecurity = assertPlatformSecurityConfiguration();',
              `const platformSecurity = assertPlatformSecurityConfiguration();\n  const platformAccessSecurity = assertPlatformAccessConfiguration();\n  logger.info({\n    action: "PlatformAccessConfiguration",\n    metadata: {\n      enabled: platformAccessSecurity.enabled,\n      issuerConfigured: Boolean(platformAccessSecurity.issuer),\n      audienceConfigured: Boolean(platformAccessSecurity.audience),\n      jwksConfigured: Boolean(platformAccessSecurity.jwksUrl)\n    },\n    module: "Platform",\n    status: platformAccessSecurity.enabled ? "ready" : "disabled"\n  });`
            );
          }
          write(serverPath, server);

          const mainPath = 'admin-global/src/main.tsx';
          let main = read(mainPath);
          if (!main.includes("from './lib/private-runtime'")) {
            const importAnchor = /import \{ App \} from ['"]\.\/App['"];?/;
            if (!importAnchor.test(main)) throw new Error('No se encontró import de App en main.tsx');
            main = main.replace(importAnchor, (match) => `${match}\nimport { assertPrivateAdminRuntimeConfiguration } from './lib/private-runtime';`);
          }
          if (!main.includes('assertPrivateAdminRuntimeConfiguration();')) {
            main = main.replace(/createRoot\(/, 'assertPrivateAdminRuntimeConfiguration();\n\ncreateRoot(');
          }
          write(mainPath, main);

          const indexPath = 'admin-global/index.html';
          let index = read(indexPath);
          if (!index.includes('name="robots"')) {
            index = index.replace(/<meta\s+name="viewport"[^>]*>/, (match) => `${match}\n    <meta name="robots" content="noindex, nofollow, noarchive">`);
          }
          if (!index.includes('name="robots" content="noindex, nofollow, noarchive"')) {
            throw new Error('No se pudo agregar meta robots privado');
          }
          write(indexPath, index);

          function setEnv(path, values) {
            let content = fs.existsSync(path) ? read(path) : '';
            for (const [key, value] of Object.entries(values)) {
              const line = `${key}=${value}`;
              const regex = new RegExp(`^${key}=.*$`, 'm');
              content = regex.test(content) ? content.replace(regex, line) : `${content.trimEnd()}\n${line}\n`;
            }
            write(path, `${content.trim()}\n`);
          }

          setEnv('admin-global/.env.example', {
            VITE_API_URL: 'https://admin-api.manecomb.com',
            VITE_PLATFORM_ACCESS_REQUIRED: 'true',
            VITE_PLATFORM_API_HOST: 'admin-api.manecomb.com'
          });
          setEnv('backend/.env.example', {
            PLATFORM_ACCESS_ENFORCEMENT_ENABLED: '',
            PLATFORM_ACCESS_ISSUER: '',
            PLATFORM_ACCESS_AUDIENCE: '',
            PLATFORM_ACCESS_JWKS_URL: ''
          });

          const backendPackagePath = 'backend/package.json';
          const backendPackage = JSON.parse(read(backendPackagePath));
          if (!backendPackage.scripts['test:platform'].includes('platform-access.test.js')) {
            backendPackage.scripts['test:platform'] += ' && node --require ./test/setup-env.js test/platform-access.test.js';
          }
          write(backendPackagePath, `${JSON.stringify(backendPackage, null, 2)}\n`);

          const adminPackagePath = 'admin-global/package.json';
          const adminPackage = JSON.parse(read(adminPackagePath));
          if (!adminPackage.scripts.test.includes('p5-private-access-contract.test.mjs')) {
            adminPackage.scripts.test += ' && node test/p5-private-access-contract.test.mjs';
          }
          adminPackage.scripts.postbuild = 'node test/private-build-smoke.mjs';
          write(adminPackagePath, `${JSON.stringify(adminPackage, null, 2)}\n`);

          const contractPath = 'scripts/validate-environment-contract.mjs';
          let contract = read(contractPath);
          contract = contract.replace(
            "['platform-auth.test.js', 'platform-mfa.test.js', 'platform-api-base.test.js', 'platform-security-config.test.js', 'platform-companies.test.js', 'platform-operations.test.js', 'platform-governance.test.js']",
            "['platform-auth.test.js', 'platform-mfa.test.js', 'platform-api-base.test.js', 'platform-security-config.test.js', 'platform-companies.test.js', 'platform-operations.test.js', 'platform-governance.test.js', 'platform-access.test.js']"
          );
          contract = contract.replace(
            "['p1-contract.test.mjs', 'p2-companies-contract.test.mjs', 'p3-operations-contract.test.mjs', 'p4-governance-contract.test.mjs']",
            "['p1-contract.test.mjs', 'p2-companies-contract.test.mjs', 'p3-operations-contract.test.mjs', 'p4-governance-contract.test.mjs', 'p5-private-access-contract.test.mjs']"
          );
          if (!contract.includes('PLATFORM_ACCESS_ENFORCEMENT_ENABLED')) {
            const anchor = "const dockerfile = read('backend/Dockerfile');";
            const checks = `const platformAccessConfig = read('backend/src/config/platform-access.js');\nconst platformAccessMiddleware = read('backend/src/middlewares/platform-access.js');\nfor (const requiredVariable of ['PLATFORM_ACCESS_ENFORCEMENT_ENABLED', 'PLATFORM_ACCESS_ISSUER', 'PLATFORM_ACCESS_AUDIENCE', 'PLATFORM_ACCESS_JWKS_URL']) {\n  if (!backend.has(requiredVariable)) fail(\`backend/.env.example: falta \${requiredVariable}\`);\n}\nif (!read('backend/src/app.js').includes('app.use("/api/platform", platformAccess, platformRouter)')) fail('Platform Access no protege /api/platform');\nif (!read('backend/src/server.js').includes('assertPlatformAccessConfiguration')) fail('Backend no valida Platform Access antes de escuchar tráfico');\nif (!platformAccessConfig.includes('PLATFORM_ACCESS_CONFIGURATION_INVALID')) fail('Falta configuración fail-closed de Platform Access');\nif (!platformAccessMiddleware.includes('cf-access-jwt-assertion')) fail('Falta validación del encabezado Access JWT');\nconst adminEnv = readEnv('admin-global/.env.example');\nif (adminEnv.get('VITE_PLATFORM_ACCESS_REQUIRED') !== 'true') fail('Admin Global debe exigir Access en producción');\nif (adminEnv.get('VITE_PLATFORM_API_HOST') !== 'admin-api.manecomb.com') fail('Admin Global debe usar el hostname API privado');\nif (!String(adminPackage.scripts?.postbuild || '').includes('private-build-smoke.mjs')) fail('Admin Global build debe validar controles privados');\n\n`;
            if (!contract.includes(anchor)) throw new Error('No se encontró ancla Dockerfile en contrato');
            contract = contract.replace(anchor, `${checks}${anchor}`);
          }
          write(contractPath, contract);
          NODE

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-global/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix admin-global

      - name: Verify Platform P5 backend and E2E
        run: |
          npm run test:platform --prefix backend
          node scripts/validate-environment-contract.mjs

      - name: Verify Admin Global private build
        env:
          VITE_API_URL: https://admin-api.manecomb.com
          VITE_PLATFORM_ACCESS_REQUIRED: "true"
          VITE_PLATFORM_API_HOST: admin-api.manecomb.com
        run: |
          npm run typecheck --prefix admin-global
          npm test --prefix admin-global
          npm run build --prefix admin-global

      - name: Close P5 and remove temporary workflow
        run: |
          cat > RC-ADM-GLOBAL-P5.md <<'EOF'
          # ADM-GLOBAL-P5 — Acceso privado y preparación de despliegue

          **Rama:** `feat/adm-global-p5-private-access`  
          **Base apilada:** `feat/adm-global-p4-governance`  
          **Estado:** código y documentación cerrados; aprovisionamiento externo pendiente

          ## Alcance cerrado

          - Validación origin-side del JWT `Cf-Access-Jwt-Assertion`.
          - Firma RS256, JWKS con cache, `iss`, `aud`, expiración, `sub` y `type=app`.
          - Preflight fail-closed cuando Access se habilita con configuración incompleta.
          - `403` para Access ausente/inválido, `503` para JWKS/configuración no disponible y posterior autenticación Platform/MFA/RBAC.
          - E2E HTTP que exige Access JWT y token Platform simultáneamente.
          - Runtime de producción que exige HTTPS y `admin-api.manecomb.com`.
          - CSP, anti-frame, no-index, HSTS, permisos restringidos y cache segura.
          - Smoke permanente del artefacto estático en `postbuild`.
          - Guía de `admin.manecomb.com`, `admin-api.manecomb.com`, Cloudflare Pages, Access, Render, rollback y evidencias.

          ## Pendiente externo

          DNS, custom domains, aplicaciones Cloudflare Access, políticas, AUD, variables Render y pruebas con Mongo/Producción no fueron modificados desde Git. P5 no se declara operativo hasta completar las evidencias de `docs/admin-global-private-deployment.md`.

          ## Certificación

          - Platform backend suites P0-P5: PASS
          - Cloudflare Access JWT/JWKS tests: PASS
          - Dual-barrier HTTP E2E: PASS
          - Admin Global typecheck and P1-P5 contracts: PASS
          - Private build smoke: PASS
          - Environment contract: PASS
          EOF

          rm .github/workflows/_temporary-certify-adm-p5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(admin): close ADM-GLOBAL-P5 code readiness"
          git push origin HEAD:feat/adm-global-p5-private-access
