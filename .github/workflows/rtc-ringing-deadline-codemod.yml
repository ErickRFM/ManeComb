name: RTC ringing deadline codemod

on:
  push:
    branches:
      - fix/rtc-ringing-deadline-authority

permissions:
  contents: write

concurrency:
  group: rtc-ringing-deadline-codemod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, '[rtc-ringing-deadline-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rtc-ringing-deadline-authority
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic ringing deadline migration
        run: node backend/scripts/apply-rtc-ringing-deadline-codemod.js

      - name: Commit generated deadline migration
        shell: bash
        run: |
          if git diff --quiet -- backend/src/services/rtc-call-service.js; then
            echo "No service diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/rtc-call-service.js
          git commit -m "fix(rtc): enforce ringing deadline in live authority [rtc-ringing-deadline-codemod]"
          git push origin HEAD:fix/rtc-ringing-deadline-authority
