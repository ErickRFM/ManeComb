name: Integrate environment audit

on:
  push:
    branches:
      - release/consolidation-20260805
    paths:
      - .github/workflows/release-integrate-env.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidation-20260805
          fetch-depth: 0

      - name: Merge certified environment audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git merge-base --is-ancestor origin/audit/environment-integrity-20260805-v2 HEAD; then
            echo 'Environment audit is already integrated.'
            exit 0
          fi

          if ! git merge --no-ff --no-edit origin/audit/environment-integrity-20260805-v2; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]}"

            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != 'mobile/package.json' ]; then
              echo '::error::Unexpected environment integration conflicts.'
              git status --short
              exit 1
            fi

            # Main owns the latest communication tests. The environment audit
            # contributes runtime-url.test.ts. Keep both in the canonical test command.
            git checkout --ours mobile/package.json
            node <<'NODE'
          const fs = require('fs');
          const path = 'mobile/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const runtimeTest = 'src/config/runtime-url.test.ts';
          if (!pkg.scripts.test.includes(runtimeTest)) {
            pkg.scripts.test = `${pkg.scripts.test} ${runtimeTest}`;
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
            git add mobile/package.json
            git commit --no-edit
          fi

          git push origin HEAD:release/consolidation-20260805
