name: RTC ringing ACK codemod

on:
  push:
    branches:
      - fix/rtc-ringing-expiry

permissions:
  contents: write

concurrency:
  group: rtc-ringing-ack-codemod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, '[rtc-ringing-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rtc-ringing-expiry
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic ringing ACK migration
        run: node backend/scripts/apply-rtc-ringing-ack-codemod.js

      - name: Commit generated ACK migration
        shell: bash
        run: |
          if git diff --quiet -- backend/src/sockets/index.js; then
            echo "No socket diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/sockets/index.js
          git commit -m "fix(rtc): expose ringing deadline in call ACK [rtc-ringing-codemod]"
          git push origin HEAD:fix/rtc-ringing-expiry
