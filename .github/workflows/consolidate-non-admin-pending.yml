name: Consolidate pending non-admin work

on:
  push:
    branches:
      - release/non-admin-consolidation-20260805

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: release/non-admin-consolidation-20260805

      - name: Merge and resolve pending non-admin branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            hotfix-radio-first-open-crash-01 \
            hotfix-mobile-runtime-lifecycle-02 \
            feat/push-calls-android-01

          git merge --no-ff --no-edit origin/hotfix-radio-first-open-crash-01
          git merge --no-ff --no-edit origin/hotfix-mobile-runtime-lifecycle-02

          if ! git merge --no-ff --no-edit origin/feat/push-calls-android-01; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' backend/package.json mobile/package.json mobile/src/features/calls/call-overlay.tsx | sort)"
            if [[ "$conflicts" != "$expected" ]]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          function readStage(stage, path) {
            return JSON.parse(execFileSync('git', ['show', `:${stage}:${path}`], { encoding: 'utf8' }));
          }

          function mergeObjectSections(ours, theirs) {
            const merged = { ...theirs, ...ours };
            for (const key of ['scripts', 'dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'engines']) {
              if (ours[key] || theirs[key]) {
                merged[key] = { ...(theirs[key] || {}), ...(ours[key] || {}) };
              }
            }
            return merged;
          }

          function unionCommands(primary, secondary) {
            const commands = String(primary || '').split(' && ').filter(Boolean);
            for (const command of String(secondary || '').split(' && ').filter(Boolean)) {
              if (!commands.includes(command)) commands.push(command);
            }
            return commands.join(' && ');
          }

          {
            const path = 'backend/package.json';
            const ours = readStage(2, path);
            const theirs = readStage(3, path);
            const merged = mergeObjectSections(ours, theirs);
            merged.scripts.test = unionCommands(ours.scripts.test, theirs.scripts.test);
            fs.writeFileSync(path, `${JSON.stringify(merged, null, 2)}\n`);
          }

          {
            const path = 'mobile/package.json';
            const ours = readStage(2, path);
            const theirs = readStage(3, path);
            const merged = mergeObjectSections(ours, theirs);
            let testCommand = ours.scripts.test;
            for (const testPath of [
              'src/features/calls/call-push-intent.test.ts',
              'src/native/call-action-headless-task.test.ts',
            ]) {
              if (!testCommand.includes(testPath)) testCommand += ` ${testPath}`;
            }
            merged.scripts.test = testCommand;
            fs.writeFileSync(path, `${JSON.stringify(merged, null, 2)}\n`);
          }
          NODE

            cat > mobile/src/features/calls/call-overlay.tsx <<'TS'
          // RC-RTC-FINALIZATION-20260805 — Overlay global de llamadas.
          // RC-MOBILE-RUNTIME-LIFECYCLE-02 — socket y foreground service con ownership serializado.
          // RC-PUSH-CALLS-ANDROID-01 — rehidrata callId desde notificacion con la app cerrada.

          import React, { useCallback, useEffect, useRef, useState } from 'react';
          import { Linking } from 'react-native';
          import { useShallow } from 'zustand/react/shallow';

          import { RadioLiveOverlay } from '@/src/features/radio-live/radio-live-overlay';
          import { getSharedRealtimeSocket, useAppStore } from '@/src/store/root-store';
          import {
            resetCallForegroundService,
            setCallForegroundServiceMode,
          } from './call-foreground-service';
          import { setCallRuntimeFactory, useCallStore } from './call-store';
          import { parsePushCallIntent, type PushCallIntent } from './call-push-intent';
          import { createNativeCallRuntime } from './call-runtime';
          import type { CallSocket } from './call-types';
          import { ActiveCallModal } from './components/active-call-modal';
          import { IncomingCallModal } from './components/incoming-call-modal';

          setCallRuntimeFactory(createNativeCallRuntime);

          export function CallOverlay(): React.ReactElement {
            const { socketStatus, token, userId } = useAppStore(
              useShallow((state) => ({
                socketStatus: state.socketStatus,
                token: state.token,
                userId: state.user?.id || null,
              }))
            );
            const socket = getSharedRealtimeSocket() as unknown as CallSocket | null;
            const bindSocket = useCallStore((state) => state.bindSocket);
            const phase = useCallStore((state) => state.phase);
            const mode = useCallStore((state) => state.mode);
            const [pendingPushCall, setPendingPushCall] = useState<PushCallIntent | null>(null);
            const consumedPushCalls = useRef(new Set<string>());

            const receivePushUrl = useCallback((url: string | null | undefined) => {
              const intent = parsePushCallIntent(url);
              if (!intent || consumedPushCalls.current.has(intent.key)) return;
              setPendingPushCall(intent);
            }, []);

            useEffect(() => {
              Linking.getInitialURL().then(receivePushUrl).catch(() => undefined);
              const subscription = Linking.addEventListener('url', ({ url }) => receivePushUrl(url));
              return () => subscription.remove();
            }, [receivePushUrl]);

            useEffect(() => {
              bindSocket(socket ?? null);
            }, [bindSocket, socket, socketStatus, token, userId]);

            useEffect(() => {
              if (!pendingPushCall || socketStatus !== 'connected') return;
              const currentSocket = getSharedRealtimeSocket() as unknown as CallSocket | null;
              if (!currentSocket) return;

              const store = useCallStore.getState();
              if (store.phase === 'IDLE') {
                store.handleIncoming({
                  callId: pendingPushCall.callId,
                  conversationId: pendingPushCall.conversationId,
                  mode: pendingPushCall.mode,
                  caller: {
                    id: pendingPushCall.callerId,
                    name: pendingPushCall.callerName,
                  },
                });
              }

              if (useCallStore.getState().callId !== pendingPushCall.callId) {
                consumedPushCalls.current.add(pendingPushCall.key);
                setPendingPushCall(null);
                return;
              }

              consumedPushCalls.current.add(pendingPushCall.key);
              setPendingPushCall(null);
              if (pendingPushCall.action === 'accept') {
                void useCallStore.getState().acceptIncomingCall();
              }
            }, [pendingPushCall, socketStatus]);

            const needsForegroundService =
              phase === 'CONNECTING' || phase === 'CONNECTED' || phase === 'RECONNECTING';

            useEffect(() => {
              setCallForegroundServiceMode(
                needsForegroundService ? (mode === 'video' ? 'video' : 'audio') : null
              ).catch(() => undefined);
            }, [mode, needsForegroundService]);

            useEffect(
              () => () => {
                const store = useCallStore.getState();
                store.unbindSocket();
                store.reset();
                resetCallForegroundService().catch(() => undefined);
              },
              []
            );

            return (
              <>
                <RadioLiveOverlay />
                <IncomingCallModal />
                <ActiveCallModal />
              </>
            );
          }
          TS

            git add backend/package.json mobile/package.json mobile/src/features/calls/call-overlay.tsx
            git commit --no-edit
          fi

          cat > RC-NON-ADMIN-CONSOLIDATION-20260805.md <<'MD'
          # Consolidación no-Admin — 2026-08-05

          Integra sobre `main` únicamente el trabajo operativo pendiente y excluye por completo las ramas P2–P5 de Admin Global.

          ## Incluido

          - PR #20: ownership serializado del foreground service de Radio y corrección del primer acceso.
          - PR #24: leases GPS, invalidación de trabajos obsoletos, reemplazo seguro de socket y foreground service de llamadas latest-intent-wins.
          - PR #23: transporte FCM HTTP v1, notificaciones Android de chat y llamadas, respuesta/rechazo controlados y rehidratación por `callId`.

          ## Resolución de integración

          - se conservaron todas las suites actuales del Backend y se añadió `fcm-notifier.test.js`;
          - se conservaron las pruebas de lifecycle GPS/llamadas y se añadieron las pruebas de push-intent/headless task;
          - `CallOverlay` combina reactividad a reemplazo de socket, foreground service serializado y consumo idempotente de intents push;
          - no se incluyó ningún commit de `feat/adm-global-p2-companies`, P3, P4 o P5.

          ## Límites externos

          La integración de código no equivale a certificación física. Firebase real, `applicationId` definitivo, credenciales FCM, pruebas con proceso muerto/pantalla bloqueada y retest físico de Radio/GPS siguen siendo gates operativos antes de un release firmado.
          MD

          git rm .github/workflows/consolidate-non-admin-pending.yml
          git add RC-NON-ADMIN-CONSOLIDATION-20260805.md
          git commit -m "chore(release): consolidate pending non-admin work"
          git push origin HEAD:release/non-admin-consolidation-20260805
