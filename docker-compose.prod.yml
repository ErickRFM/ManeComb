services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      REDIS_URL: redis://redis:6379
      ENABLE_REDIS: "true"
      ENABLE_QUEUES: "true"
      REQUIRE_MONGO: "true"
      TRUST_PROXY: "true"
    expose:
      - "5000"
    depends_on:
      - redis
    restart: always

  web:
    build:
      context: .
      dockerfile: mobile/Dockerfile.web
    expose:
      - "80"
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always

  coturn:
    image: coturn/coturn:4
    command:
      - "--no-cli"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=${TURN_REALM:-manecomb.local}"
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    restart: always

volumes:
  redis-data:
