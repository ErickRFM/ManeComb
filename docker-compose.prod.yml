services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      REDIS_URL: redis://redis:6379
      ENABLE_REDIS: "true"
      ENABLE_QUEUES: "true"
      REQUIRE_MONGO: "true"
      TRUST_PROXY: "true"
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    restart: always

  web:
    build:
      context: .
      dockerfile: mobile/Dockerfile.web
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  coturn:
    image: coturn/coturn:4
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      exec turnserver --no-cli --fingerprint --lt-cred-mech --use-auth-secret
      --static-auth-secret="$${TURN_SECRET:?TURN_SECRET is required}"
      --realm="$${TURN_REALM:-manecomb.local}"
      --min-port=49160 --max-port=49200
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always

volumes:
  redis-data:
