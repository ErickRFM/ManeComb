services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      REDIS_URL: redis://redis:6379
      ENABLE_REDIS: "true"
      ENABLE_QUEUES: "true"
      TRUST_PROXY: "true"
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: mobile/Dockerfile.web
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  redis-data:
